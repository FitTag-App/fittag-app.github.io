<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTag – gesund essen &amp; bewegen</title>
<style>
  :root{
    --bg:#f6f3ec; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7a70; --line:#e6e0d3;
    --green:#2f7d4f; --green-soft:#dcefe2; --blue:#2b6cb0; --blue-soft:#dde9f7;
    --orange:#d9772b; --orange-soft:#fbe6d3; --red:#b8483c; --yellow-soft:#fbf1cf;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:14px;row-gap:10px}
  .hquote{border-left:3px solid var(--green);padding:2px 0 2px 12px;margin:0 4px 14px}
  .hquote p{margin:0;font-family:Georgia,"Noto Serif",serif;font-style:italic;font-size:15px;line-height:1.4;color:var(--ink)}
  .hquote small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  h1{font-family:Georgia,"Noto Serif",serif;font-size:30px;margin:0;letter-spacing:-.5px}
  h1 span{color:var(--green)}
  .titlerow{display:flex;align-items:center;gap:10px}
  .langwrap{position:relative}
  .langbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:4px}
  .langmenu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(31,42,36,.15);padding:6px;min-width:170px}
  .langmenu.open{display:block}
  .langmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-size:15px;color:var(--ink);text-align:left}
  .langmenu button:hover{background:var(--bg)}
  .langmenu button.on{background:var(--green-soft);font-weight:700}
  h2{font-family:Georgia,"Noto Serif",serif;font-size:20px;margin:0 0 12px}
  .sub{color:var(--muted);font-size:13px}
  .datebar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
  .datebar button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--ink)}
  .datebar button:hover{background:var(--bg)}
  .datebar button:disabled{opacity:.3;cursor:default}
  .datebar b{font-size:13px;min-width:88px;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
  .ring{position:relative;width:100%;max-width:96px;aspect-ratio:1;margin:0 auto}
  .ring svg{transform:rotate(-90deg);width:100%;height:100%;display:block}
  .ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .val b{font-size:17px}
  .ring .val small{font-size:10px;color:var(--muted)}
  .ring-label{font-size:12px;font-weight:600;margin-top:6px}
  .purple{--p:#7b4fb8}
  .steps-quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .score{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--green-soft);font-size:14px;text-align:center}
  .counter{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
  .counter:first-of-type{border-top:0;padding-top:0}
  .counter .lbl{display:flex;align-items:center;gap:10px;font-weight:600}
  .counter .lbl i{font-style:normal;font-size:24px}
  .counter .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:600;color:var(--ink)}
  .stepper button.plus{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stepper button.plus.bad{background:var(--orange);border-color:var(--orange)}
  .stepper b{min-width:26px;text-align:center;font-size:18px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .row{display:flex;gap:8px;align-items:center}
  input[type=text],input[type=number]{font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
  input:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
  .btn{border:0;background:var(--green);color:#fff;font-weight:600;font-size:15px;padding:11px 16px;border-radius:12px;white-space:nowrap}
  .btn:disabled{opacity:.45;cursor:default}
  .list{list-style:none;margin:12px 0 0;padding:0}
  .list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px dashed var(--line);font-size:15px}
  .list li .x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:4px 8px}
  .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;margin-right:6px}
  .t-gut{background:var(--green-soft);color:var(--green)}
  .t-ok{background:var(--yellow-soft);color:#8a6a10}
  .t-wenig{background:var(--orange-soft);color:var(--orange)}
  .empty{color:var(--muted);font-size:14px;margin:10px 0 0}
  .tip{background:var(--blue-soft);border:0}
  .tip p{margin:0;font-size:15px;line-height:1.45}
  .tip .k{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;margin-top:8px}
  .bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bar .col{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--green);min-height:4px}
  .bar .col.b{background:var(--blue)}
  .bar .col.o{background:var(--orange)}
  .bar small{font-size:11px;color:var(--muted)}
  .bar.today small{color:var(--ink);font-weight:700}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--bg);border-radius:14px;padding:12px}
  .stat b{font-size:22px;display:block}
  .stat small{color:var(--muted);font-size:12px}
  .goal{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .goal:first-of-type{border-top:0}
  .goal input{width:90px;text-align:center}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  nav .in{display:flex;gap:6px;max-width:560px;width:100%}
  nav button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button i{font-style:normal;font-size:20px}
  nav button.on{background:var(--green-soft);color:var(--green)}
  .view{display:none}.view.on{display:block}
  .storage{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:18px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:normal;max-width:min(92vw,520px);width:max-content;text-align:center;z-index:300}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:18px;background:#fff;cursor:pointer;text-align:center;font-weight:600;color:var(--muted);min-height:110px}
  .drop img{display:none;max-width:100%;max-height:220px;border-radius:10px}
  .drop.has img{display:block}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pbtn{position:relative;overflow:hidden;border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 8px;text-align:center;font-weight:600;font-size:15px;color:var(--ink)}
  .pbtn:active{background:var(--green-soft)}
  .pbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
  .paste{width:100%;margin-top:8px;font-family:inherit;font-size:13px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:#fff;color:var(--ink);resize:none}
  .prev{display:none;max-width:100%;max-height:240px;border-radius:12px;margin:10px auto 0}
  .prev.on{display:block}
  .burn{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .wide{width:100%;margin-top:10px}
  .loading{color:var(--muted);font-size:14px;margin:14px 0 0;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .result{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg)}
  .result h3{margin:0 0 4px;font-size:17px}
  .big{font-size:28px;font-weight:700;color:var(--orange)}
  .macros{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
  .macros span{background:#fff;border-radius:999px;padding:5px 10px;font-size:13px}
  .items{margin:8px 0;padding:0;list-style:none;font-size:14px}
  .items li{display:flex;justify-content:space-between;padding:5px 0;border-top:1px dashed var(--line)}
  .sugg{background:#fff;border-radius:12px;padding:12px;margin-top:10px}
  .sugg b{font-size:15px}
  .sugg p{margin:4px 0 8px;font-size:14px;color:var(--ink)}
  .sugg small{color:var(--muted);font-size:12px}
  .sugg .btn{padding:8px 12px;font-size:13px;margin-top:8px}
  .err{color:var(--red);font-size:14px;margin:12px 0 0}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
  .bwrap{margin-top:6px}
  .badges{display:flex;flex-wrap:wrap;gap:5px}
  .badge{border:0;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600;line-height:1.3}
  .badge.bad{background:var(--orange-soft);color:#9a4a12}
  .badge.good{background:var(--green-soft);color:var(--green)}
  .badge.sel{outline:2px solid currentColor}
  .why{display:none;font-size:13px;line-height:1.45;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0 0}
  .why.on{display:block}
  .mtxt{flex:1;min-width:0}
  .hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
  .hrow:first-child{border-top:0}
  .hrow small{color:var(--muted)}
  .gcard{padding:14px 18px}
  .track{position:relative;isolation:isolate;height:118px;overflow:hidden;border-radius:14px;background:#eef8fc}
  .track.m-sick,.track.m-vsick{background:linear-gradient(#eceee4,#f2f0e8)}
  .ground{position:absolute;left:0;right:0;bottom:8px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px)}
  .park{position:absolute;inset:0;width:100%;height:100%}
  .walker{position:absolute;bottom:2px;width:58px;height:68px;left:40%;transform-origin:50% 100%}
  .walker .flip{position:relative;width:100%;height:100%}
  .walker.idle .fig .leg,.walker.idle .fig .shin,.walker.idle .fig .arm,.walker.idle .pet .pleg{animation:none}
  .walker.idle .fig .lean{animation-duration:2.4s}
  .track{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .walker .pet{overflow:visible}
  @keyframes walk{from{left:-64px}to{left:100%}}
  .walker .actor{width:100%;height:100%;transform-origin:50% 62%}
  .walker .actor svg{width:100%;height:100%;overflow:visible}
  .fig .leg{transform-origin:60px 91px;animation:thigh var(--spd,1s) linear infinite}
  .fig .shin{transform-origin:60px 108px;animation:shin var(--spd,1s) linear infinite}
  .fig .arm{transform-origin:60px 53px;animation:uarm var(--spd,1s) ease-in-out infinite}
  .fig .fore{transform-origin:60px 66px;transform:rotate(calc(var(--amp,20deg) * -1 - 10deg))}
  .fig .legB,.fig .legB .shin,.fig .armB{animation-delay:calc(var(--spd,1s) / -2)}
  .fig .lean{transform-origin:60px 128px;animation:bob calc(var(--spd,1s)/2) ease-in-out infinite}
  .fig .capeflow{transform-origin:54px 50px;animation:cape calc(var(--spd,1s)) ease-in-out infinite}
  @keyframes thigh{0%,100%{transform:rotate(calc(var(--amp,20deg) * -1.1))}50%{transform:rotate(calc(var(--amp,20deg) * .9))}}
  @keyframes shin{0%{transform:rotate(0deg)}35%{transform:rotate(calc(var(--amp,20deg) * .3))}55%{transform:rotate(calc(var(--amp,20deg) * 1))}70%{transform:rotate(calc(var(--amp,20deg) * 2.2))}88%{transform:rotate(calc(var(--amp,20deg) * .6))}100%{transform:rotate(0deg)}}
  @keyframes uarm{0%,100%{transform:rotate(calc(var(--amp,20deg) * .9))}50%{transform:rotate(calc(var(--amp,20deg) * -.9))}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(var(--tilt,0deg))}50%{transform:translateY(var(--bob,-3px)) rotate(var(--tilt,0deg))}}
  @keyframes cape{0%,100%{transform:rotate(0deg)}50%{transform:rotate(8deg)}}
  .fig.clap .arm{animation:clap .34s ease-in-out infinite}
  .fig.clap .armB{animation-delay:-.17s}
  .fig.clap .fore{transform:rotate(-35deg)}
  @keyframes clap{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(-105deg)}}
  .fig.armsup .arm{animation:none;transform:rotate(180deg)}
  .fig.armsup .fore{transform:none}
  .actor.t-spin{animation:spin 1.1s ease-in-out}
  @keyframes spin{0%{transform:none}20%{transform:translateY(-8px) scaleX(.15)}40%{transform:translateY(-12px) scaleX(-1)}60%{transform:translateY(-12px) scaleX(-.15)}80%{transform:translateY(-6px) scaleX(1)}100%{transform:none}}
  .actor.t-dance{animation:dance 1.5s ease-in-out}
  @keyframes dance{0%,100%{transform:none}15%{transform:translateX(-4px) rotate(-10deg)}30%{transform:translate(4px,-5px) rotate(10deg)}45%{transform:translateX(-4px) rotate(-10deg)}60%{transform:translate(4px,-5px) rotate(10deg)}75%{transform:translateX(-3px) rotate(-6deg)}}
  .fig.dance .arm{animation:dancearm .3s ease-in-out infinite alternate}
  .fig.dance .armB{animation-delay:-.15s}
  .fig.dance .fore{transform:rotate(-25deg)}
  @keyframes dancearm{from{transform:rotate(145deg)}to{transform:rotate(205deg)}}
  .fig.wave .armA{animation:wave .28s ease-in-out infinite alternate}
  .fig.wave .armA .fore{transform:rotate(-15deg)}
  @keyframes wave{from{transform:rotate(-165deg)}to{transform:rotate(-125deg)}}
  .walker .pop{position:absolute;left:50%;top:-16px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--ink);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none;animation:popup 1.6s ease forwards;z-index:5}
  @keyframes popup{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
  .actor.t-hop{animation:hop 1.5s ease-in-out}
  @keyframes hop{0%,100%{transform:none}10%{transform:translateY(-16px)}20%{transform:none}35%{transform:translateY(-16px)}45%{transform:none}60%{transform:translateY(-16px)}70%{transform:none}}
  .actor.t-salto{animation:salto 1.2s ease-in-out}
  @keyframes salto{0%{transform:none}15%{transform:translateY(2px) scaleY(.92)}55%{transform:translateY(-38px) rotate(-200deg)}85%{transform:translateY(-6px) rotate(-345deg)}100%{transform:rotate(-360deg)}}
  .actor.t-cart{animation:cart 1.3s linear}
  @keyframes cart{0%{transform:none}50%{transform:translateY(-14px) rotate(180deg)}100%{transform:rotate(360deg)}}
  .crawl .carm{transform-origin:77px 101px;animation:crawlA var(--spd,2s) ease-in-out infinite}
  .crawl .carmB{animation-delay:calc(var(--spd,2s) / -2)}
  .crawl .cleg{transform-origin:45px 102px;animation:crawlL var(--spd,2s) ease-in-out infinite}
  .crawl .clegA{animation-delay:calc(var(--spd,2s) / -2)}
  .crawl .crawlbody{animation:crawlbob var(--spd,2s) ease-in-out infinite}
  @keyframes crawlA{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(14deg)}}
  @keyframes crawlL{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes crawlbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  .pet{position:absolute;left:-33px;bottom:0;width:33px;height:23px;overflow:visible}
  .haspartner .pet{left:-58px}
  .partner{position:absolute;left:-30px;bottom:0;width:100%;height:100%}
  .partner .pbob{width:100%;height:100%}
  .partner .pbob svg{width:100%;height:100%;overflow:visible}
  .partner .heart{position:absolute;left:40%;top:-6px;font-size:11px;animation:heart 2.6s ease-in-out infinite}
  @keyframes heart{0%,60%,100%{opacity:0;transform:translateY(6px) scale(.6)}75%{opacity:1;transform:translateY(-4px) scale(1)}90%{opacity:0;transform:translateY(-12px) scale(1.1)}}
  .pet .pleg{transform-box:fill-box;transform-origin:50% 0;animation:pleg calc(var(--spd,1s) * .6) ease-in-out infinite}
  .pet .pB{animation-delay:calc(var(--spd,1s) * -.3)}
  .pet .ptail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .35s ease-in-out infinite alternate}
  .pet.bunny{animation:bhop calc(var(--spd,1s) * .8) ease-in-out infinite}
  .pet.p-jump{animation:pjump .9s ease-in-out}
  @keyframes pleg{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
  @keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
  @keyframes bhop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes pjump{0%,100%{transform:none}40%{transform:translateY(-18px) rotate(-12deg)}}
  .m-fit{--dur:3.4s;--spd:.52s;--amp:27deg;--bob:-5px;--tilt:4deg}
  .m-good{--dur:7s;--spd:.82s;--amp:22deg;--bob:-3px;--tilt:2deg}
  .m-meh{--dur:11s;--spd:1.1s;--amp:16deg;--bob:-2px;--tilt:0deg}
  .m-sick{--dur:19s;--spd:1.8s;--amp:9deg;--bob:-1px;--tilt:9deg}
  .m-vsick{--dur:36s;--spd:2.4s;--amp:6deg}
  @media (prefers-reduced-motion:reduce){.walker{animation:none;left:calc(50% - 43px)}.fig *,.pet,.pet *,.actor{animation:none!important}}
  .mood{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px}
  .mood b{font-size:17px}
  .mood small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
  .bar2{height:10px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:4px}
  .bar2 > div{height:100%;border-radius:999px;transition:width .5s}
  .glabel{display:flex;justify-content:space-between;font-size:13px;margin-top:10px;font-weight:600}
  .glabel span:last-child{font-weight:700}
  .lrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;font-size:15px}
  .lrow.me{background:var(--green-soft);font-weight:700}
  .lpos{width:28px;text-align:center}
  .lname{flex:1}
  .trogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tro{background:var(--bg);border-radius:14px;padding:12px;opacity:.45;filter:grayscale(1)}
  .tro.ok{opacity:1;filter:none;background:var(--yellow-soft)}
  .tro .te{font-size:24px}
  .tro b{display:block;font-size:14px;margin-top:4px}
  .tro small{color:var(--muted);font-size:12px}
  .avbtn{position:absolute;top:8px;right:8px;z-index:3;border:0;background:rgba(255,253,248,.92);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

  window.__fitErr = (msg) => { try { const b = document.getElementById("errBox"); b.style.display = "block"; b.textContent = "⚠️ FitTag-Fehler (bitte Screenshot an Claude schicken):\n" + String(msg).slice(0,400); clearTimeout(window.__fitErrT); window.__fitErrT = setTimeout(()=>{ b.style.display="none"; }, 15000); } catch(e){} };

</script>

      "tour":[["👋 Willkommen bei FitTag!", "Deine Figur im Park zeigt, wie es dir heute geht: Je gesünder dein Tag, desto fitter und fröhlicher wird sie. Bei einem ungesunden Tag wird sie müde – oder krabbelt sogar."], ["👆 Tipp auf deine Figur!", "Mit jedem Tippen macht sie ein anderes Kunststück: Salto, Rad, Pirouette, Hüpfer, Winken, Tanzen … Unter „✏️ Aussehen“ gestaltest du sie – mit Kostümen, Haustier, Begleitung und neuen Orten."], ["✅ Einfach abhaken", "Trag Wasser, Obst & Gemüse, Schritte, Bewegung und Mahlzeiten ein – die bunten Ringe zeigen deine Tagesziele. Im Büro helfen kurze Bewegungs-, Augen- und Atempausen."], ["🎯 Challenge des Tages", "Jeden Tag eine kleine Aufgabe für Bonuspunkte. Tipp auf die Karte, dann siehst du genau, was zu tun ist."], ["🍽️ Alles rund ums Essen", "📸 Fotografier dein Essen – FitTag schätzt Kalorien und zeigt Gesundheits-Hinweise. 📋 Scanne im Restaurant die Speisekarte, 💡 hol dir Essensideen, 🧊 schau, was du aus deinem Kühlschrank kochen kannst, und sammle 📖 Rezepte, einen 🗓️ Wochenplan und deine 🛒 Einkaufsliste."], ["🏆 Liga · 📊 Woche", "Sammle Punkte gegen Bots oder Freunde, mach bei Events mit und schalte Kostüme und neue Orte frei. Sonntags kommt dein Wochenbericht. Viel Spaß!"]],"tr.salto":"Salto! 🤸","tr.hop":"Hüpf, hüpf! 🦘","tr.cart":"Rad! 🎡","tr.spin":"Pirouette! 🌀","tr.clap":"Bravo! 👏","tr.wave":"Hallo! 👋","tr.dance":"Tanz! 💃","ev.info":"ℹ️ Tippen für Details","ev.what":"Was zählt?","ev.when":"Zeitraum","ev.how":"So geht's","met.waterDays.how":"Jeder Tag, an dem du dein Trinkziel erreichst (💧 unter „Schnell abhaken“), zählt 1.","met.vegTotal.how":"Jede Portion Obst & Gemüse zählt 1 – per 🥦-Zähler, gesunden Schnell-Knöpfen oder erkanntem Gemüse auf Fotos.","met.vegDays.how":"Jeder Tag, an dem du dein Obst-&-Gemüse-Ziel erreichst, zählt 1.","met.steps.how":"Alle Schritte, die du unter 👟 Schritte einträgst, werden zusammengezählt.","met.moveMin.how":"Alle Bewegungsminuten (unter „Bewegung“ und die 10-Min-Bewegungspause) werd llte. Sei einer.", "Marc Aurel"], ["Wer weiß, wann es genug ist, hat immer genug.", "Laozi"], ["Bewegung und Maßhalten können sich viel von der Kraft der Jugend bis ins Alter bewahren.", "Cicero"], ["Sie können es, weil sie glauben, dass sie es können.", "Vergil"], ["Steter Tropfen höhlt den Stein.", "Ovid"], ["Der Anfang ist der wichtigste Teil der Arbeit.", "Platon"], ["Ein gesunder Geist in einem gesunden Körper.", "Juvenal"], ["Das Glück deines Lebens hängt von der Beschaffenheit deiner Gedanken ab.", "Marc Aurel"], ["Nicht weil es schwer ist, wagen wir es nicht, sondern weil wir es nicht wagen, ist es schwer.", "Seneca"], ["Andere zu kennen ist Klugheit, sich selbst zu kennen ist Weisheit.", "Laozi"], ["Nichts Großes entsteht plötzlich.", "Epiktet"], ["Die Sonne ist jeden Tag neu.", "Heraklit"], ["Langsam und stetig gewinnt das Rennen.", "Äsop"], ["Stück für Stück kommt man ans Ziel.", "Äsop"], ["Vereinfache, vereinfache!", "Henry David Thoreau"], ["Nimm dir das Tempo der Natur: Ihr Geheimnis ist Geduld.", "Ralph Waldo Emerson"], ["Wie Eisen rostet, wenn es nicht gebraucht wird, so schwächt Untätigkeit den Geist.", "Leonardo da Vinci"], ["Untätigkeit zerstört die gute Verfassung jedes Menschen, Bewegung und Übung erhalten sie.", "Platon"], ["Solange du lebst, lerne, wie man lebt.", "Seneca"], ["Es braucht sehr wenig, um ein glückliches Leben zu führen.", "Marc Aurel"], ["Reichtum besteht nicht im Besitz vieler Güter, sondern in wenigen Wünschen.", "Epiktet"], ["Dankbarkeit ist nicht nur die größte aller Tugenden, sondern die Mutter aller anderen.", "Cicero"], ["Übung ist der beste Lehrmeister.", "Publilius Syrus"], ["Gönn dir Ruhe: Ein Feld, das geruht hat, bringt reiche Ernte.", "Ovid"], ["Gut gemacht ist besser als gut gesagt.", "Benjamin Franklin"], ["Verlorene Zeit findet man nie wieder.", "Benjamin Franklin"], ["Wer gar zu viel bedenkt, wird wenig leisten.", "Friedrich Schiller"], ["Grau, teurer Freund, ist alle Theorie, und grün des Lebens goldner Baum.",       "gi.title":"Setz dir ein Ziel!","gi.sub":"Wähle, was du erreichen möchtest – FitTag begleitet dich mit eigenen Seiten dafür:","gi.mine":"🎯 Deine Ziele:","gi.edit":"✏️ Ziele ändern / hinzufügen",
      "sp.sub":"Sag einfach, was du gegessen, getrunken und gemacht hast – FitTag trägt alles für dich ein.","sp.btn":"🎤 Jetzt sprechen",
      "tour3":[["👋 Willkommen bei FitTag!", "Schön, dass du da bist! In einer Minute zeige ich dir alles. Wie heißt du – und in welcher Sprache möchtest du FitTag nutzen?", "heute/home"], ["🌳 Deine Figur im Park", "Sie zeigt, wie es dir heute geht: Trinkst, isst und bewegst du dich gesund, wird sie fit und fröhlich – sonst müde. Auch das Wetter reagiert: wenig Wasser = Dürre ☀️, viel Ungesundes = Gewitter ⛈️. Tipp sie an für Kunststücke, unter „Aussehen“ gestaltest du sie und wählst Haustier oder Partner. Jede Portion Obst & Gemüse pflanzt eine Blume in deinen Park. Lebensenergie und Lebensuhr sind nur Spielwerte zum Spaß – keine echte Vorhersage.", "heute/home"], ["💬 Sprich mit ihr!", "Tipp im Park auf 💬 und erzähl deiner Figur, wie es dir geht – sie hört zu und antwortet mit Stimme. Partner und Haustier quatschen auch mit. Tipp auf den Gedanken des Tages, dann wird er dir vorgelesen.", "heute/home"], ["✅ Eintragen", "Hier trägst du Wasser, Obst & Gemüse, Schritte, Bewegung und deine Stimmung ein – mit + und −. Am schnellsten geht's mit 🎤 „Jetzt sprechen“: einfach sagen, was du gemacht hast.", "heute/log"], ["🍽️ Essen", "Fotografiere deine Mahlzeit, sprich oder schreib sie auf – FitTag schätzt die Kalorien und zeigt Gesundheits-Hinweise wie Zucker, Salz oder Ballaststoffe.", "essen/analyze"], ["💡 Ideen & Einkauf", "Lass dir Essen vorschlagen, scanne Speisekarten oder Etiketten im Supermarkt, stöbere in Rezepten, plane deine Woche und führe deine Einkaufsliste.", "essen/ideas"], ["🎯 Mein Ziel", "Setz dir ein Ziel: Kilos verlieren, Körperfett, Bauchumfang, Kleidergröße – oder einfach gesünder essen. Dazu gibt's Sparschwein, Zugreise durch Europa, Bingo und Erfolge.", "diet"], ["🏆 Punkte & Liga", "Für alles Gesunde gibt's Punkte, Level und eine Tages-Challenge. Schaffst du 5 Challenges pro Woche, öffnest du eine Überraschungsbox 🎁. In der Liga trittst du gegen Bots an – und gegen Freunde per Freundescode.", "liga"], ["💼 Büro & Pausen", "Kurze Übungen für zwischendurch – deine Figur macht sie dir vor. Auf Wunsch erinnert FitTag dich an Pausen.", "heute/office"], ["👤 Profil", "Hier stellst du deine Tagesziele ein, siehst unter „📊 Meine Woche“ Kalender, Monatsbild und Jahresrückblick und schaltest Wetter, Nachtmodus oder Abendroutine an und aus.", "ziele"], ["👉 Fertig – los geht's!", "Wisch nach links oder rechts, um zwischen den Seiten zu wechseln. Der runde 🎤-Knopf unten rechts ist immer für dich da. Viel Spaß mit FitTag!", "heute/home"]],"tour.name":"Dein Vorname","tour.lang":"Sprache",

      "tc.lines":["Die Fahrkarten, bitte! 🎫", "Oh, ein Haustier mit eigenem Ticket – sehr vorbildlich!", "Nächster Halt: {c}! Bitte Wasserflaschen nicht vergessen. 💧", "Ihre Fahrkarte ist gültig – Ihre Snacks sehen auch sehr gesund aus! 🍎", "Ich laufe jeden Tag 12.000 Schritte durch diesen Zug. Mein Geheimnis! 🚶"],"tc.trolley":["Snackwagen! Apfel oder Möhrchen? 🍎🥕", "Heute im Angebot: Wasser – gratis für Reisende mit ⭐!", "Schokolade ist leider aus … aber ich hab Erdbeeren! 🍓"],"tc.cabin":"Im Abteil nach {c}","tc.tap":"Tipp den Schaffner an!",

      "sub.learn":"📚 Wissen","lr.title":"📚 Wissenshappen","lr.sub":"Kurz lesen, eine Frage beantworten – fertig. Der erste neue Happen am Tag bringt +0,5 ⭐ für die Reise.","lr.prog":"{n} von {m} gelernt","lr.all":"🎓 Alles gelernt – du bist Ernährungs-Profi! Du kannst die Fragen jederzeit wiederholen.","lr.wrong":"Nicht ganz – lies die Punkte nochmal.","lr.retry":"🔁 Nochmal versuchen","lr.toastStar":"📚 Gelernt! +0,5 ⭐ für die Reise","lr.toast":"📚 Gelernt! Weiter so","lr.teaser":"Wissenshappen des Tages","lr.go":"Lernen","lr.goStar":"Lernen · +0,5 ⭐","lr.doneToday":"✓ Heute schon gelernt – Lust auf noch einen?","lr.lessons":[["Das Teller-Prinzip", ["Die Hälfte des Tellers: Gemüse und etwas Obst.", "Ein Viertel: Vollkorn – z. B. Vollkornbrot, -reis, -nudeln oder Kartoffeln.", "Ein Viertel: Eiweiß – Hülsenfrüchte, Fisch, Ei, Milchprodukte oder mageres Fleisch."], "Wie viel vom Teller sollte Gemüse und Obst sein?", ["Ein Viertel", "Die Hälfte", "Drei Viertel"], 1, "Die Hälfte – so wirst du satt, bekommst viele Vitamine und Ballaststoffe und sparst ganz nebenbei Kalorien."], ["Richtig trinken", ["Erwachsene sollten rund 1,5 Liter am Tag trinken – bei Hitze oder Sport mehr.", "Am besten: Wasser und ungesüßter Tee.", "Trick: Zu jeder Mahlzeit ein Glas Wasser – und eine Flasche sichtbar hinstellen."], "Wie viel sollten Erwachsene ungefähr am Tag trinken?", ["0,5 Liter", "1,5 Liter", "4 Liter"], 1, "Etwa 1,5 Liter reichen meist – an heißen Tagen oder beim Sport entsprechend mehr."], ["Versteckter Zucker", ["Die WHO rät: höchstens 10 % der Energie aus freiem Zucker, ideal unter 5 % – das sind etwa 25 g (6 Teelöffel).", "Zucker versteckt sich oft in Softdrinks, Fruchtjoghurt, Müsli, Ketchup und Soßen.", "Wasser statt Limo ist der einfachste Schritt."], "Wie viel Zucker steckt ungefähr in einer Dose Cola (0,33 l)?", ["3 Würfelzucker", "11 Würfelzucker", "25 Würfelzucker"], 1, "Rund 35 g Zucker – schon mehr als die 25 g, die die WHO als ideale Grenze für den ganzen Tag nennt."], ["Ballaststoffe", ["Empfohlen sind mindestens 30 g am Tag – die meisten essen deutlich weniger.", "Gute Quellen: Vollkorn, Hülsenfrüchte, Gemüse, Obst und Nüsse.", "Sie machen lange satt, helfen der Verdauung und halten den Blutzucker ruhiger. Dazu genug trinken!"], "Welches Brot hat am meisten Ballaststoffe?", ["Weißbrot", "Vollkornbrot", "Croissant"], 1, "Vollkornbrot – im ganzen Korn stecken die meisten Ballaststoffe, Vitamine und Mineralstoffe."], ["Gute Fette", ["Ungesättigte Fette tun Herz und Gefäßen gut: Raps- und Olivenöl, Nüsse, Avocado.", "Fetter Seefisch (z. B. Lachs, Hering) liefert Omega-3 – ein- bis zweimal pro Woche Fisch ist eine gute Idee.", "Weniger: Wurst, Frittiertes, Gebäck und gehärtete Fette."], "Welches Fett ist besonders günstig für Herz und Gefäße?", ["Rapsöl", "Palmfett", "Butterschmalz"], 0, "Rapsöl – es hat viele ungesättigte Fettsäuren und sogar etwas pflanzliches Omega-3."], ["Eiweiß", ["Erwachsene brauchen etwa 0,8 g Eiweiß pro kg Körpergewicht am Tag (ab 65 etwa 1 g).", "Bei 70 kg sind das rund 56 g – z. B. Joghurt, eine Portion Linsen und etwas Käse.", "Pflanzliche Quellen: Linsen, Bohnen, Kichererbsen, Tofu, Vollkorn. Eiweiß macht lange satt."], "Wie viel Eiweiß brauchen Erwachsene ungefähr am Tag?", ["0,8 g pro kg Körpergewicht", "3 g pro kg Körpergewicht", "10 g insgesamt"], 0, "Rund 0,8 g pro kg – mehr ist für die meisten nicht nötig, und das lässt sich gut über den Tag verteilen."], ["Weniger Salz", ["Empfohlen sind höchstens etwa 5–6 g Salz am Tag – ungefähr ein Teelöffel.", "Das meiste Salz steckt schon in Brot, Käse, Wurst und Fertiggerichten.", "Würz mit Kräutern, Gewürzen, Knoblauch oder Zitrone – der Geschmack gewöhnt sich schnell um."], "Woher kommt das meiste Salz, das wir essen?", ["Aus dem Salzstreuer", "Aus Brot, Käse, Wurst und Fertiggerichten", "Aus Obst und Gemüse"], 1, "Aus verarbeiteten Lebensmitteln – der Salzstreuer macht nur einen kleinen Teil aus."], ["Stark verarbeitete Lebensmittel", ["Gemeint sind Industrieprodukte mit vielen Zusatzstoffen wie Aromen und Emulgatoren.", "Sie enthalten oft viel Zucker, Fett und Salz und man isst leicht zu viel davon.", "Tipp: Kurze Zutatenlisten wählen und öfter selbst kochen – jedes hausgemachte Gericht bringt dir in FitTag einen Stern."], "Woran erkennst du stark verarbeitete Lebensmittel oft?", ["Lange Zutatenliste mit Zusatzstoffen", "Sie sind tiefgekühlt", "Sie kommen vom Markt"], 0, "An der langen Zutatenliste. Tiefkühlgemüse ohne Zusätze ist dagegen kaum verarbeitet und sehr gesund."], ["Langsam essen", ["Das Sättigungsgefühl kommt erst nach etwa 20 Minuten an.", "Wer langsam isst, isst oft weniger – ohne hungrig zu bleiben.", "Tipp: Gabel zwischendurch ablegen, gut kauen und ohne Handy oder Fernseher essen."], "Wie lange dauert es ungefähr, bis das Sättigungsgefühl ankommt?", ["2 Minuten", "20 Minuten", "2 Stunden"], 1, "Etwa 20 Minuten – deshalb lohnt es sich, nach dem ersten Teller kurz zu warten, bevor man nachnimmt."], ["Bunt essen – 5 am Tag", ["„5 am Tag“: 3 Portionen Gemüse und 2 Portionen Obst.", "Eine Portion ist ungefähr eine Handvoll.", "Verschiedene Farben bringen verschiedene Vitamine und Pflanzenstoffe – auch Tiefkühlgemüse zählt."], "Wie groß ist bei „5 am Tag“ ungefähr eine Portion?", ["Eine Handvoll", "Ein Teelöffel", "Ein ganzer Teller"], 0, "Eine Handvoll – praktisch, denn die eigene Hand wächst mit: Kinder brauchen kleinere Portionen."], ["Schlaf und Hunger", ["Wenig Schlaf erhöht das Hungerhormon Ghrelin und senkt das Sättigungshormon Leptin.", "Die Folge: mehr Lust auf Süßes und Fettiges.", "Koffein wirkt lange – nach etwa 5 Stunden ist erst die Hälfte abgebaut. Deshalb gibt es in FitTag die Kaffee-Grenze."], "Was passiert oft nach zu wenig Schlaf?", ["Mehr Appetit auf Süßes und Fettiges", "Weniger Hunger", "Gar nichts"], 0, "Mehr Appetit – genug Schlaf (für Erwachsene meist 7–9 Stunden) hilft also auch beim gesunden Essen."], ["Clever einkaufen", ["Mit Einkaufsliste und nicht hungrig einkaufen – das spart Geld und Spontankäufe.", "Auf der Zutatenliste steht das, wovon am meisten drin ist, ganz vorne.", "Zucker und Salz pro 100 g vergleichen; der Nutri-Score hilft bei der Orientierung."], "Was bedeutet es, wenn Zucker auf der Zutatenliste ganz vorne steht?", ["Es ist besonders viel Zucker drin", "Es ist wenig Zucker drin", "Zucker ist nur zur Deko"], 0, "Die Zutaten stehen nach Menge sortiert – was vorne steht, ist am meisten drin."], ["Ein gutes Frühstück", ["Eiweiß und Ballaststoffe halten lange satt – z. B. Haferflocken mit Joghurt und Obst, Vollkornbrot mit Ei oder Quark.", "Gezuckerte Cerealien und Gebäck machen meist schnell wieder hungrig.", "Kein Hunger am Morgen? Dann musst du nichts erzwingen – plane einfach einen gesunden Snack für später."], "Welches Frühstück hält am längsten satt?", ["Croissant mit Marmelade", "Haferflocken mit Joghurt und Obst", "Nur ein Kaffee"], 1, "Haferflocken mit Joghurt und Obst – die Kombination aus Ballaststoffen und Eiweiß sättigt besonders lange."], ["Snacks bei der Arbeit", ["Plane deine Snacks: eine Handvoll Nüsse, Obst, Gemüsesticks mit Hummus oder ein Joghurt.", "Süßigkeiten außer Sichtweite – was wir sehen, essen wir eher.", "Eine Flasche Wasser auf dem Tisch hilft, Durst nicht mit Hunger zu verwechseln."], "Was hilft am besten gegen die Süßigkeiten-Falle im Büro?", ["Gesunde Snacks griffbereit haben", "Den ganzen Tag nichts essen", "Schokolade in die Schublade legen"], 0, "Gesunde Snacks griffbereit – wer vorbereitet ist, greift seltener spontan zu Süßem."], ["Essen gehen", ["Gegrillt, gedünstet oder gebacken ist meist leichter als frittiert oder paniert.", "Soße oder Dressing extra bestellen – dann bestimmst du die Menge.", "Wasser dazu trinken, Beilage gegen Salat oder Gemüse tauschen und Nachtisch gern teilen."], "Welche Zubereitung ist meist die leichtere Wahl?", ["Frittiert", "Gegrillt oder gedünstet", "Paniert"], 1, "Gegrillt oder gedünstet – dabei kommt viel weniger Fett dazu als beim Frittieren oder Panieren."], ["Getränke & Alkohol", ["Ein Gramm Alkohol hat etwa 7 kcal – fast so viel wie Fett.", "Ein halber Liter Bier hat ungefähr 200 kcal, ein Glas Wein (0,2 l) etwa 150 kcal.", "Für die Gesundheit gilt: je weniger Alkohol, desto besser. Tipp: Zu jedem Glas ein Glas Wasser."], "Wie viele Kalorien hat ein Gramm Alkohol ungefähr?", ["1 kcal", "7 kcal", "20 kcal"], 1, "Etwa 7 kcal – mehr als Zucker oder Eiweiß (je etwa 4 kcal) und fast so viel wie Fett (9 kcal)."], ["Heißhunger", ["Heißhunger kommt oft in Wellen und wird nach ein paar Minuten schwächer.", "Trink ein Glas Wasser, warte 10 Minuten oder geh kurz an die frische Luft.", "Regelmäßige, sättigende Mahlzeiten beugen Heißhunger am besten vor."], "Was hilft oft bei Heißhunger?", ["Ein Glas Wasser und 10 Minuten abwarten", "Sofort die ganze Tafel essen", "Mahlzeiten auslassen"], 0, "Wasser und kurz abwarten – oft lässt das Verlangen dann schon deutlich nach."], ["Vorkochen", ["Koch eine größere Menge und teil sie für die nächsten Tage in Portionen auf.", "Gekochte Reste halten im Kühlschrank meist 2–3 Tage, eingefroren deutlich länger.", "So hast du auch an stressigen Tagen etwas Gesundes parat – und es zählt als hausgemacht!"], "Wie lange halten gekochte Reste im Kühlschrank meist?", ["2–3 Tage", "2 Wochen", "1 Monat"], 0, "Meist 2–3 Tage. Was du länger aufheben willst, frierst du am besten gleich ein."], ["Vegetarisch & pflanzlich", ["Mehr Pflanzen auf dem Teller tun Gesundheit und Klima gut.", "Hülsenfrüchte und Getreide kombiniert liefern hochwertiges Eiweiß – z. B. Linsen mit Reis.", "Wer vegan isst, sollte Vitamin B12 ergänzen. Eisen aus Pflanzen wird mit Vitamin C (z. B. Paprika) besser aufgenommen."], "Welches Vitamin müssen Veganer ergänzen?", ["Vitamin C", "Vitamin B12", "Vitamin A"], 1, "Vitamin B12 – es kommt fast nur in tierischen Lebensmitteln vor."], ["Saisonal essen", ["Obst und Gemüse der Saison sind oft frischer, aromatischer und günstiger.", "Im Winter haben bei uns z. B. Grünkohl, Rotkohl, Möhren, Rote Bete und Äpfel Saison.", "Tiefkühlgemüse ist eine gute Alternative – es wird erntefrisch eingefroren."], "Welches Gemüse hat in Deutschland im Winter Saison?", ["Grünkohl", "Spargel", "Zucchini"], 0, "Grünkohl – Spargel hat im Frühling Saison, Zucchini im Sommer."], ["Portionen mit der Hand", ["Eiweiß (Fleisch, Fisch, Tofu): etwa eine Handfläche.", "Beilagen wie Reis oder Nudeln: etwa eine Faust. Gemüse: zwei Hände voll.", "Fett wie Butter oder Öl: etwa ein Daumen. Kleinere Teller helfen zusätzlich."], "Welche Handportion passt ungefähr für Fett wie Butter oder Öl?", ["Daumengröße", "Faustgröße", "Zwei Hände voll"], 0, "Daumengröße – Fett ist sehr energiereich, da reicht eine kleine Menge."], ["Etiketten lesen", ["Vergleiche Nährwerte immer pro 100 g – so siehst du Unterschiede sofort.", "„Zuckerarm“ darf ein Lebensmittel heißen, wenn es höchstens 5 g Zucker pro 100 g hat.", "„Light“ heißt nur: mindestens 30 % weniger von etwas – nicht unbedingt kalorienarm."], "Was bedeutet „light“ auf der Packung?", ["Kalorienfrei", "Mindestens 30 % weniger von etwas als vergleichbare Produkte", "Bio-Qualität"], 1, "Mindestens 30 % weniger von einem Nährstoff (z. B. Fett) – das Produkt kann trotzdem viele Kalorien haben."], ["Essen bei Stress", ["Stress kann Lust auf Süßes und Fettiges machen.", "Frag dich kurz: Habe ich wirklich Hunger – oder bin ich gestresst, müde oder gelangweilt?", "Gegen Stress helfen auch ein kurzer Spaziergang, ein paar tiefe Atemzüge oder ein Gespräch."], "Welche Frage hilft beim Stress-Essen?", ["Habe ich wirklich Hunger – oder bin ich gestresst?", "Was ist am süßesten?", "Wie schnell kann ich essen?"], 0, "Diese kurze Pause hilft, echten Hunger von Stress zu unterscheiden."], ["Süßes ohne schlechtes Gewissen", ["Strenge Verbote machen das Verlangen oft größer.", "Genieß Süßes bewusst: eine kleine Portion auf einem Teller, im Sitzen, ohne Ablenkung.", "Faustregel: Meistens gesund, manchmal Genuss – dafür gibt es in FitTag auch den Genuss-Joker."], "Was hilft, Süßes entspannt zu genießen?", ["Bewusst eine kleine Portion genießen", "Es komplett verbieten", "Heimlich im Stehen essen"], 0, "Bewusst und in Ruhe genießen – so reicht oft schon eine kleine Portion."]],
      "lr.rev":"🔁 Wiederholungsfrage des Tages","lr.revSub":"Du hast alles gelernt! Jeden Tag gibt es eine Frage aus einem alten Happen – richtig beantwortet bringt sie +0,5 ⭐.","lr.revDone":"✓ Heute schon wiederholt – morgen gibt's eine neue Frage.","lr.revGo":"Quiz · +0,5 ⭐","lr.revWrong":"Nicht ganz – richtig ist: {a}","lr.revTeaser":"Wiederholungsfrage des Tages","tour3":[["👋 Willkommen bei FitTag!", "Schön, dass du da bist! In einer Minute zeige ich dir alles. Wie heißt du – und in welcher Sprache möchtest du FitTag nutzen?", "heute/home"], ["🌳 Deine Figur im Park", "Sie zeigt, wie es dir heute geht: Trinkst, isst und bewegst du dich gesund, wird sie fit und fröhlich – sonst müde. Auch das Wetter reagiert: wenig Wasser = Dürre ☀️, viel Ungesundes = Gewitter ⛈️. Tipp sie an für Kunststücke, unter „Aussehen“ gestaltest du sie und wählst Haustier oder Partner. Jede Portion Obst & Gemüse pflanzt eine Blume in deinen Park. Lebensenergie und Lebensuhr sind nur Spielwerte zum Spaß – keine echte Vorhersage.", "heute/home"], ["💬 Sprich mit ihr!", "Tipp im Park auf 💬 und erzähl deiner Figur, wie es dir geht – sie hört zu und antwortet mit Stimme. Partner und Haustier quatschen auch mit. Unten findest du außerdem den Wissenshappen des Tages.", "heute/home"], ["✅ Eintragen", "Hier hakst du Wasser, Obst & Gemüse, hausgemachte Gerichte, Kaffee (mit deiner Uhrzeit-Grenze), Schritte, Bewegung und Stimmung ab – mit + und −. Am schnellsten geht's mit 🎤: einfach sagen, was du gemacht hast.", "heute/log"], ["🍽️ Essen", "Wähl Frühstück, Mittag, Abendessen oder Snack. Bei Snacks tippst du gesunde oder ungesunde einfach an. Mahlzeiten kannst du auch fotografieren oder aufsagen – FitTag schätzt die Kalorien. Selbst gekocht? Tipp auf 🏠 Hausgemacht.", "essen/analyze"], ["💡 Ideen & Einkauf", "Lass dir Essen vorschlagen, scanne Speisekarten oder Etiketten, stöbere in Rezepten, plane deine Woche und setz Zutaten direkt auf die Einkaufsliste.", "essen/ideas"], ["📚 Wissen", "24 kurze Wissenshappen rund ums gesunde Essen – lesen, eine Frage beantworten, fertig. Der erste neue Happen am Tag bringt einen halben Reisestern ⭐.", "essen/learn"], ["🎯 Mein Ziel", "Setz dir ein Ziel: Kilos verlieren, Körperfett, Bauchumfang, Kleidergröße – oder einfach gesünder essen. Dazu gibt's Sparschwein, Bingo und Erfolge.", "diet"], ["🚆 Die Reise durch Europa", "Alles Gesunde bringt Reisesterne ⭐ – Wasser, Gemüse, Bewegung, Hausgemachtes und mehr. Alle 4 Sterne erreichst du eine neue Stadt mit eigenem Abenteuer. Im Zugabteil kannst du mit allen sprechen, und unterwegs warten Schachrätsel, Memory und Quiz.", "diet"], ["🏆 Punkte & Liga", "Für alles Gesunde gibt's Punkte, Level und eine Tages-Challenge. Schaffst du 5 Challenges pro Woche, öffnest du eine Überraschungsbox 🎁. In der Liga trittst du gegen Bots an – und gegen Freunde per Freundescode.", "liga"], ["💼 Büro & Pausen", "Kurze Übungen für zwischendurch – deine Figur macht sie dir vor. Auf Wunsch erinnert FitTag dich an Pausen.", "heute/office"], ["👤 Profil", "Hier stellst du deine Tagesziele ein, siehst unter „📊 Meine Woche“ Kalender, Monatsbild und Jahresrückblick und schaltest Wetter, Nachtmodus oder Abendroutine an und aus.", "ziele"], ["👉 Fertig – los geht's!", "Wisch nach links oder rechts, um zwischen den Seiten zu wechseln. Der runde 🎤-Knopf unten rechts ist immer für dich da. Viel Spaß mit FitTag!", "heute/home"]],
      "tourS":[["👋 Willkommen bei FitTag!", "Schön, dass du da bist! Wie heißt du – und in welcher Sprache möchtest du FitTag nutzen?", "heute/home"], ["🌳 Deine Figur", "Sie zeigt, wie es dir heute geht: Lebst du gesund, wird sie fit und fröhlich. Tipp sie an für Kunststücke, tipp auf 💬, um mit ihr zu sprechen. Jede Portion Obst & Gemüse pflanzt eine Blume in deinen Park. Lebensenergie und Lebensuhr sind nur Spielwerte zum Spaß – keine echte Vorhersage.", "heute/home"], ["👉 Wie geht's weiter?", "Wisch nach links oder rechts, um die Seiten zu wechseln. Der 🎤-Knopf ist immer für dich da. Möchtest du gleich loslegen – oder erst alles sehen?", "heute/home"]],"ptips":{"heute/log": ["✅ Eintragen", "Hier hakst du mit + und − ab: Wasser, Obst & Gemüse, Hausgemachtes, Kaffee, Schritte, Bewegung und Stimmung. Noch schneller: 🎤 und einfach sagen, was du gemacht hast."], "heute/office": ["💼 Büro", "Kurze Übungen für zwischendurch – deine Figur macht sie vor. Auf Wunsch erinnert dich FitTag an Pausen."], "essen/analyze": ["🍽️ Mein Essen", "Wähl die Mahlzeit, tipp Snacks einfach an oder fotografier dein Essen – FitTag schätzt die Kalorien. Selbst gekocht? Tipp auf 🏠."], "essen/ideas": ["💡 Ideen", "Lass dir passende Gerichte vorschlagen oder scanne eine Speisekarte. Zutaten landen mit einem Tipp auf der Einkaufsliste."], "essen/recipes": ["📖 Rezepte", "Gesunde Rezepte zum Stöbern. Hast du eins gekocht, trägst du es mit einem Tipp ein."], "essen/plan": ["🗓️ Plan", "Plane deine Mahlzeiten für die Woche – das spart Zeit und Spontankäufe."], "essen/shop": ["🛒 Einkauf", "Deine Einkaufsliste, sortiert nach Supermarkt-Gängen. Hak ab, was schon im Wagen liegt."], "essen/learn": ["📚 Wissen", "Kurze Wissenshappen ums gesunde Essen: lesen, eine Frage beantworten, fertig. Der erste neue am Tag bringt +0,5 ⭐ für die Reise."], "diet": ["🎯 Mein Ziel", "Setz dir ein Ziel – abnehmen, Bauchumfang oder einfach gesünder essen. Oben wechselst du zwischen Heute, Sparschwein, Reise, Bingo und mehr."], "diet/trip": ["🚆 Die Reise", "Alles Gesunde bringt Reisesterne ⭐. Alle 4 Sterne erreichst du eine neue Stadt mit eigenem Abenteuer. Im Zug kannst du mit allen sprechen und Rätsel lösen."], "liga": ["🏆 Liga", "Sammle Punkte für Gesundes und miss dich mit Bots – oder mit Freunden per Freundescode."], "ziele": ["👤 Profil", "Hier stellst du deine Tagesziele ein, findest deine Woche, Kalender und Rückblick und schaltest Extras wie den Nachtmodus an oder aus."], "heute/review": ["🗣️ Rückblick", "Hier erzählt dir deine Figur, wie deine letzte Woche war – mit einem Lob und einem kleinen Tipp. Darunter siehst du deine Wochenzahlen."], "heute/play": ["🎮 Spielen", "Hier findest du die Tages-Challenge, den Wochen-Boss, das Glücksrad, Wissenshappen und die Wochen-Überraschung."]},"ptip.ok":"Verstanden 👍",

      "tour3":[["👋 Welcome to FitTag!", "Great to have you! In one minute I'll show you everything. What's your name – and which language would you like to use?", "heute/home"], ["🌳 Your figure in the park", "It shows how your day is going: drink, eat and move healthily and it gets fit and happy – otherwise tired. The weather reacts too: little water = drought ☀️, lots of junk = thunderstorm ⛈️. Tap it for tricks; under “Look” you style it and pick a pet or partner. Every portion of fruit & veg plants a flower in your park. Life energy and life clock are just playful game values – not a real prediction.", "heute/home"], ["💬 Talk to it!", "Tap 💬 in the park and tell your figure how you're doing – it listens and answers out loud. Partner and pet join in too. Tap the thought of the day to hear it read aloud.", "heute/home"], ["✅ Logging", "Log water, fruit & veg, steps, exercise and your mood here – with + and −. Quickest of all: 🎤 “Speak now” and just say what you did.", "heute/log"], ["🍽️ Food", "Snap your meal, say it or type it – FitTag estimates the calories and shows health notes like sugar, salt or fibre.", "essen/analyze"], ["💡 Ideas & shopping", "Get meal ideas, scan menus or supermarket labels, browse recipes, plan your week and keep your shopping list.", "essen/ideas"], ["🎯 My goal", "Set a goal: lose kilos, body fat, waist, clothing size – or simply eat healthier. With a piggy bank, a train trip through Europe, bingo and wins.", "diet"], ["🏆 Points & league", "Everything healthy earns points, levels and a daily challenge. Finish 5 challenges a week to open a surprise box 🎁. In the league you compete with bots – and with friends via friend code.", "liga"], ["💼 Office & breaks", "Short exercises for in between – your figure shows you how. If you like, FitTag reminds you to take breaks.", "heute/office"], ["👤 Profile", "Set your daily goals here, find calendar, monthly picture and year in review under “📊 My week”, and switch weather, night mode or evening routine on and off.", "ziele"], ["👉 Done – let's go!", "Swipe left or right to move between pages. The round 🎤 button at the bottom right is always there for you. Have fun with FitTag!", "heute/home"]],"tour.name":"Your first name","tour.lang":"Language",

      "sub.learn":"📚 Learn","lr.title":"📚 Bite-size knowledge","lr.sub":"Read briefly, answer one question – done. The first new bite each day earns +0.5 ⭐ for the journey.","lr.prog":"{n} of {m} learned","lr.all":"🎓 All learned – you're a nutrition pro! You can repeat the questions any time.","lr.wrong":"Not quite – read the points again.","lr.retry":"🔁 Try again","lr.toastStar":"📚 Learned! +0.5 ⭐ for the journey","lr.toast":"📚 Learned! Keep it up","lr.teaser":"Today's bite of knowledge","lr.go":"Learn","lr.goStar":"Learn · +0.5 ⭐","lr.doneToday":"✓ Already learned today – fancy another one?","lr.lessons":[["The plate method", ["Half the plate: vegetables and a little fruit.", "A quarter: whole grains – e.g. wholemeal bread, brown rice, whole-wheat pasta or potatoes.", "A quarter: protein – pulses, fish, eggs, dairy or lean meat."], "How much of your plate should be vegetables and fruit?", ["A quarter", "Half", "Three quarters"], 1, "Half – it fills you up, gives you lots of vitamins and fibre, and saves calories along the way."], ["Drinking well", ["Adults should drink about 1.5 litres a day – more in hot weather or with exercise.", "Best choices: water and unsweetened tea.", "Trick: a glass of water with every meal – and keep a bottle where you can see it."], "Roughly how much should adults drink per day?", ["0.5 litres", "1.5 litres", "4 litres"], 1, "About 1.5 litres is usually enough – more on hot days or when you exercise."], ["Hidden sugar", ["The WHO advises at most 10% of energy from free sugars, ideally under 5% – about 25 g (6 teaspoons).", "Sugar often hides in soft drinks, fruit yoghurt, cereal, ketchup and sauces.", "Water instead of soda is the easiest step."], "Roughly how much sugar is in a can of cola (330 ml)?", ["3 sugar cubes", "11 sugar cubes", "25 sugar cubes"], 1, "About 35 g of sugar – already more than the 25 g the WHO names as the ideal limit for the whole day."], ["Fibre", ["At least 30 g a day is recommended – most people eat far less.", "Good sources: whole grains, pulses, vegetables, fruit and nuts.", "It keeps you full for longer, helps digestion and steadies blood sugar. Drink enough with it!"], "Which bread has the most fibre?", ["White bread", "Wholemeal bread", "Croissant"], 1, "Wholemeal bread – the whole grain holds most of the fibre, vitamins and minerals."], ["Good fats", ["Unsaturated fats are good for your heart: rapeseed and olive oil, nuts, avocado.", "Oily fish (e.g. salmon, herring) provides omega-3 – fish once or twice a week is a good idea.", "Eat less: sausages, fried food, pastries and hydrogenated fats."], "Which fat is especially good for your heart?", ["Rapeseed oil", "Palm fat", "Clarified butter"], 0, "Rapeseed oil – rich in unsaturated fats and even some plant omega-3."], ["Protein", ["Adults need about 0.8 g of protein per kg of body weight a day (from 65 about 1 g).", "At 70 kg that's roughly 56 g – e.g. yoghurt, a portion of lentils and some cheese.", "Plant sources: lentils, beans, chickpeas, tofu, whole grains. Protein keeps you full."], "Roughly how much protein do adults need per day?", ["0.8 g per kg of body weight", "3 g per kg of body weight", "10 g in total"], 0, "About 0.8 g per kg – most people don't need more, and it's easy to spread over the day."], ["Less salt", ["At most about 5–6 g of salt a day is recommended – roughly one teaspoon.", "Most salt is already in bread, cheese, cured meats and ready meals.", "Season with herbs, spices, garlic or lemon – your taste adapts quickly."], "Where does most of the salt we eat come from?", ["The salt shaker", "Bread, cheese, cured meats and ready meals", "Fruit and vegetables"], 1, "From processed foods – the salt shaker is only a small part."], ["Ultra-processed food", ["This means industrial products with many additives such as flavourings and emulsifiers.", "They are often high in sugar, fat and salt, and it's easy to eat too much of them.", "Tip: choose short ingredient lists and cook more yourself – every homemade dish earns you a star in FitTag."], "How can you often recognise ultra-processed food?", ["A long ingredient list with additives", "It's frozen", "It's from the market"], 0, "By the long ingredient list. Frozen vegetables without additives, on the other hand, are barely processed and very healthy."], ["Eat slowly", ["Feeling full only kicks in after about 20 minutes.", "People who eat slowly often eat less – without staying hungry.", "Tip: put your fork down between bites, chew well and eat without phone or TV."], "Roughly how long does it take for the feeling of fullness to arrive?", ["2 minutes", "20 minutes", "2 hours"], 1, "About 20 minutes – so it's worth waiting a moment after the first plate before taking seconds."], ["Eat the rainbow – 5 a day", ["\"5 a day\": 3 portions of vegetables and 2 portions of fruit.", "One portion is about a handful.", "Different colours bring different vitamins and plant compounds – frozen vegetables count too."], "For \"5 a day\", roughly how big is one portion?", ["A handful", "A teaspoon", "A whole plate"], 0, "A handful – handy, because your hand grows with you: children need smaller portions."], ["Sleep and hunger", ["Too little sleep raises the hunger hormone ghrelin and lowers the fullness hormone leptin.", "The result: more cravings for sweet and fatty food.", "Caffeine lasts long – after about 5 hours only half is gone. That's why FitTag has a coffee cut-off."], "What often happens after too little sleep?", ["More cravings for sweet and fatty food", "Less hunger", "Nothing at all"], 0, "More cravings – so enough sleep (usually 7–9 hours for adults) also helps you eat healthily."], ["Smart shopping", ["Shop with a list and not when hungry – it saves money and impulse buys.", "Ingredients are listed by amount – whatever there's most of comes first.", "Compare sugar and salt per 100 g; the Nutri-Score helps as a guide."], "What does it mean if sugar is right at the start of the ingredient list?", ["There's a lot of sugar in it", "There's little sugar in it", "The sugar is just decoration"], 0, "Ingredients are sorted by amount – what comes first is what there's most of."], ["A good breakfast", ["Protein and fibre keep you full for long – e.g. oats with yoghurt and fruit, wholemeal bread with egg or quark.", "Sugary cereals and pastries usually make you hungry again quickly.", "Not hungry in the morning? No need to force it – just plan a healthy snack for later."], "Which breakfast keeps you full the longest?", ["Croissant with jam", "Oats with yoghurt and fruit", "Just a coffee"], 1, "Oats with yoghurt and fruit – the mix of fibre and protein keeps you full especially long."], ["Snacks at work", ["Plan your snacks: a handful of nuts, fruit, veg sticks with hummus or a yoghurt.", "Keep sweets out of sight – we tend to eat what we see.", "A bottle of water on your desk helps you not to mistake thirst for hunger."], "What helps most against the office sweets trap?", ["Having healthy snacks at hand", "Eating nothing all day", "Keeping chocolate in the drawer"], 0, "Healthy snacks at hand – when you're prepared, you reach for sweets less often."], ["Eating out", ["Grilled, steamed or baked is usually lighter than fried or breaded.", "Ask for sauce or dressing on the side – then you decide how much.", "Drink water, swap the side for salad or vegetables and feel free to share dessert."], "Which cooking method is usually the lighter choice?", ["Fried", "Grilled or steamed", "Breaded"], 1, "Grilled or steamed – much less fat is added than with frying or breading."], ["Drinks & alcohol", ["One gram of alcohol has about 7 kcal – almost as much as fat.", "Half a litre of beer has roughly 200 kcal, a glass of wine (200 ml) about 150 kcal.", "For your health: the less alcohol, the better. Tip: a glass of water with every drink."], "Roughly how many calories does one gram of alcohol have?", ["1 kcal", "7 kcal", "20 kcal"], 1, "About 7 kcal – more than sugar or protein (about 4 kcal each) and almost as much as fat (9 kcal)."], ["Cravings", ["Cravings often come in waves and get weaker after a few minutes.", "Drink a glass of water, wait 10 minutes or get some fresh air.", "Regular, filling meals are the best way to prevent cravings."], "What often helps with cravings?", ["A glass of water and waiting 10 minutes", "Eating the whole bar right away", "Skipping meals"], 0, "Water and a short wait – the craving often fades noticeably."], ["Meal prep", ["Cook a bigger batch and split it into portions for the next few days.", "Cooked leftovers usually keep 2–3 days in the fridge, much longer frozen.", "That way you have something healthy ready even on busy days – and it counts as homemade!"], "How long do cooked leftovers usually keep in the fridge?", ["2–3 days", "2 weeks", "1 month"], 0, "Usually 2–3 days. Anything you want to keep longer is best frozen straight away."], ["Vegetarian & plant-based", ["More plants on your plate are good for your health and the climate.", "Pulses combined with grains provide high-quality protein – e.g. lentils with rice.", "If you eat vegan, take a vitamin B12 supplement. Iron from plants is absorbed better with vitamin C (e.g. peppers)."], "Which vitamin do vegans need to supplement?", ["Vitamin C", "Vitamin B12", "Vitamin A"], 1, "Vitamin B12 – it's found almost only in animal foods."], ["Eating seasonally", ["Seasonal fruit and vegetables are often fresher, tastier and cheaper.", "In winter in central Europe, kale, red cabbage, carrots, beetroot and apples are in season.", "Frozen vegetables are a good alternative – they're frozen fresh from the harvest."], "Which vegetable is in season in winter in Germany?", ["Kale", "Asparagus", "Courgette"], 0, "Kale – asparagus is in season in spring, courgettes in summer."], ["Portions by hand", ["Protein (meat, fish, tofu): about one palm.", "Sides like rice or pasta: about one fist. Vegetables: two handfuls.", "Fat like butter or oil: about one thumb. Smaller plates help too."], "Which hand portion roughly fits fat like butter or oil?", ["Thumb-sized", "Fist-sized", "Two handfuls"], 0, "Thumb-sized – fat is very energy-dense, so a small amount is enough."], ["Reading labels", ["Always compare nutrition values per 100 g – you'll see differences right away.", "A food may be called \"low sugar\" if it has at most 5 g of sugar per 100 g.", "\"Light\" only means at least 30% less of something – not necessarily low in calories."], "What does \"light\" on the pack mean?", ["Calorie-free", "At least 30% less of something than comparable products", "Organic quality"], 1, "At least 30% less of one nutrient (e.g. fat) – the product can still have lots of calories."], ["Eating under stress", ["Stress can make you crave sweet and fatty food.", "Ask yourself briefly: am I really hungry – or stressed, tired or bored?", "A short walk, a few deep breaths or a chat also help against stress."], "Which question helps with stress eating?", ["Am I really hungry – or am I stressed?", "What's the sweetest?", "How fast can I eat?"], 0, "This short pause helps you tell real hunger from stress."], ["Sweets without guilt", ["Strict bans often make cravings stronger.", "Enjoy sweets mindfully: a small portion on a plate, sitting down, without distractions.", "Rule of thumb: mostly healthy, sometimes a treat – that's what FitTag's treat joker is for."], "What helps you enjoy sweets in a relaxed way?", ["Mindfully enjoying a small portion", "Banning them completely", "Eating them secretly while standing"], 0, "Mindfully and calmly – that way a small portion is often enough."]],
      "lr.rev":"🔁 Today's review question","lr.revSub":"You've learned everything! Each day there's a question from an earlier bite – answered correctly, it earns +0.5 ⭐.","lr.revDone":"✓ Already reviewed today – a new question tomorrow.","lr.revGo":"Quiz · +0.5 ⭐","lr.revWrong":"Not quite – the answer is: {a}","lr.revTeaser":"Today's review question","tour3":[["👋 Welcome to FitTag!", "Great to have you! In one minute I'll show you everything. What's your name – and which language would you like to use?", "heute/home"], ["🌳 Your figure in the park", "It shows how your day is going: drink, eat and move healthily and it gets fit and happy – otherwise tired. The weather reacts too: little water = drought ☀️, lots of junk = thunderstorm ⛈️. Tap it for tricks; under “Look” you style it and pick a pet or partner. Every portion of fruit & veg plants a flower in your park. Life energy and life clock are just playful game values – not a real prediction.", "heute/home"], ["💬 Talk to it!", "Tap 💬 in the park and tell your figure how you're doing – it listens and answers out loud. Partner and pet join in too. Further down you'll also find today's bite of knowledge.", "heute/home"], ["✅ Logging", "Tick off water, fruit & veg, homemade dishes, coffee (with your cut-off time), steps, exercise and mood here – with + and −. Quickest of all: 🎤 – just say what you did.", "heute/log"], ["🍽️ Food", "Pick breakfast, lunch, dinner or snack. For snacks, just tap healthy or unhealthy ones. You can also snap or say your meals – FitTag estimates the calories. Cooked it yourself? Tap 🏠 Homemade.", "essen/analyze"], ["💡 Ideas & shopping", "Get meal ideas, scan menus or labels, browse recipes, plan your week and put ingredients straight on your shopping list.", "essen/ideas"], ["📚 Learn", "24 short bites of knowledge about healthy eating – read, answer one question, done. The first new bite each day earns half a travel star ⭐.", "essen/learn"], ["🎯 My goal", "Set a goal: lose kilos, body fat, waist, clothing size – or simply eat healthier. With a piggy bank, bingo and wins.", "diet"], ["🚆 The journey through Europe", "Everything healthy earns travel stars ⭐ – water, veg, exercise, homemade food and more. Every 4 stars take you to a new city with its own adventure. In the train compartment you can talk to everyone, and chess puzzles, memory and quizzes await on the way.", "diet"], ["🏆 Points & league", "Everything healthy earns points, levels and a daily challenge. Finish 5 challenges a week to open a surprise box 🎁. In the league you compete with bots – and with friends via friend code.", "liga"], ["💼 Office & breaks", "Short exercises for in between – your figure shows you how. If you like, FitTag reminds you to take breaks.", "heute/office"], ["👤 Profile", "Set your daily goals here, find calendar, monthly picture and year in review under “📊 My week”, and switch weather, night mode or evening routine on and off.", "ziele"], ["👉 Done – let's go!", "Swipe left or right to move between pages. The round 🎤 button at the bottom right is always there for you. Have fun with FitTag!", "heute/home"]],
      "tourS":[["👋 Welcome to FitTag!", "Great to have you! What's your name – and which language would you like to use?", "heute/home"], ["🌳 Your figure", "It shows how your day is going: live healthily and it gets fit and happy. Tap it for tricks, tap 💬 to talk to it. Every portion of fruit & veg plants a flower in your park. Life energy and life clock are just playful game values – not a real prediction.", "heute/home"], ["👉 What's next?", "Swipe left or right to switch pages. The 🎤 button is always there for you. Want to get started right away – or see everything first?", "heute/home"]],"ptips":{"heute/log": ["✅ Logging", "Tick things off with + and −: water, fruit & veg, homemade dishes, coffee, steps, exercise and mood. Even quicker: 🎤 – just say what you did."], "heute/office": ["💼 Office", "Short exercises for in between – your figure shows you how. If you like, FitTag reminds you to take breaks."], "essen/analyze": ["🍽️ My food", "Pick the meal, just tap snacks or snap a photo of your food – FitTag estimates the calories. Cooked it yourself? Tap 🏠."], "essen/ideas": ["💡 Ideas", "Get dish suggestions or scan a menu. Ingredients go onto your shopping list with one tap."], "essen/recipes": ["📖 Recipes", "Healthy recipes to browse. Cooked one? Log it with a single tap."], "essen/plan": ["🗓️ Plan", "Plan your meals for the week – it saves time and impulse buys."], "essen/shop": ["🛒 Shopping", "Your shopping list, sorted by supermarket aisle. Tick off what's already in the trolley."], "essen/learn": ["📚 Learn", "Short bites of knowledge about healthy eating: read, answer one question, done. The first new one each day earns +0.5 ⭐ for the journey."], "diet": ["🎯 My goal", "Set a goal – lose weight, waist size or simply eat healthier. At the top you switch between Today, piggy bank, journey, bingo and more."], "diet/trip": ["🚆 The journey", "Everything healthy earns travel stars ⭐. Every 4 stars take you to a new city with its own adventure. On the train you can talk to everyone and solve puzzles."], "liga": ["🏆 League", "Collect points for healthy things and compete with bots – or with friends via friend code."], "ziele": ["👤 Profile", "Set your daily goals here, find your week, calendar and review, and switch extras like night mode on or off."], "heute/review": ["🗣️ Review", "Here your figure tells you how your last week went – with praise and one small tip. Below you see your numbers for the week."], "heute/play": ["🎮 Play", "Here you'll find the daily challenge, the weekly boss, the lucky wheel, bites of knowledge and the weekly surprise."]},"ptip.ok":"Got it 👍",

      "tour3":[["👋 Bienvenue sur FitTag !", "Ravi de te voir ! En une minute, je te montre tout. Comment t'appelles-tu – et dans quelle langue veux-tu utiliser FitTag ?", "heute/home"], ["🌳 Ton personnage dans le parc", "Il montre comment se passe ta journée : bois, mange et bouge sainement et il devient en forme et joyeux – sinon fatigué. La météo réagit aussi : peu d'eau = sécheresse ☀️, beaucoup de malbouffe = orage ⛈️. Appuie dessus pour des figures ; dans « Apparence », tu le personnalises et choisis un animal ou un·e partenaire. Chaque portion de fruits & légumes plante une fleur dans ton parc. L'énergie vitale et l'horloge de vie ne sont que des valeurs de jeu – pas une vraie prévision.", "heute/home"], ["💬 Parle-lui !", "Appuie sur 💬 dans le parc et dis à ton personnage comment tu vas – il écoute et répond à voix haute. Partenaire et animal participent aussi. Appuie sur la pensée du jour pour l'entendre.", "heute/home"], ["✅ Noter", "Note ici l'eau, les fruits & légumes, les pas, l'activité et ton humeur – avec + et −. Le plus rapide : 🎤 « Parler maintenant » et dis simplement ce que tu as fait.", "heute/log"], ["🍽️ Repas", "Photographie ton repas, dis-le ou écris-le – FitTag estime les calories et affiche des repères santé comme sucre, sel ou fibres.", "essen/analyze"], ["💡 Idées & courses", "Demande des idées de repas, scanne menus ou étiquettes au supermarché, parcours les recettes, planifie ta semaine et tiens ta liste de courses.", "essen/ideas"], ["🎯 Mon objectif", "Fixe-toi un objectif : perdre des kilos, de la masse grasse, du tour de taille, une taille de vêtement – ou simplement manger plus sainement. Avec tirelire, voyage en train à travers l'Europe, bingo et victoires.", "diet"], ["🏆 Points & ligue", "Tout ce qui est sain rapporte des points, des niveaux et un défi du jour. Réussis 5 défis par semaine pour ouvrir une boîte surprise 🎁. Dans la ligue, tu affrontes des bots – et tes amis via un code ami.", "liga"], ["💼 Bureau & pauses", "De courts exercices pour la journée – ton personnage te les montre. Si tu veux, FitTag te rappelle de faire des pauses.", "heute/office"], ["👤 Profil", "Règle ici tes objectifs du jour, retrouve calendrier, image du mois et rétrospective dans « 📊 Ma semaine », et active ou non météo, mode nuit ou routine du soir.", "ziele"], ["👉 C'est parti !", "Glisse à gauche ou à droite pour changer de page. Le bouton rond 🎤 en bas à droite est toujours là pour toi. Amuse-toi bien avec FitTag !", "heute/home"]],"tour.name":"Ton prénom","tour.lang":"Langue",

      "tc.lines":["Billets, s'il vous plaît ! 🎫", "Oh, un animal avec son propre billet – très bien élevé !", "Prochain arrêt : {c} ! N'oubliez pas vos bouteilles d'eau. 💧", "Votre billet est valable – et vos snacks ont l'air très sains ! 🍎", "Je fais 12 000 pas dans ce train chaque jour. Mon secret ! 🚶"],"tc.trolley":["Chariot de snacks ! Pomme ou carottes ? 🍎🥕", "Aujourd'hui : de l'eau – gratuite pour les voyageurs avec ⭐ !", "Plus de chocolat … mais j'ai des fraises ! 🍓"],"tc.cabin":"Dans le compartiment vers {c}","tc.tap":"Touche le contrôleur !",
