      "sub.learn":"📚 Savoir","lr.title":"📚 Bouchées de savoir","lr.sub":"Lire rapidement, répondre à une question – c'est tout. La première nouvelle bouchée du jour rapporte +0,5 ⭐ pour le voyage.","lr.prog":"{n} sur {m} appris","lr.all":"🎓 Tout appris – tu es un pro de la nutrition ! Tu peux refaire les questions quand tu veux.","lr.wrong":"Pas tout à fait – relis les points.","lr.retry":"🔁 Réessayer","lr.toastStar":"📚 Appris ! +0,5 ⭐ pour le voyage","lr.toast":"📚 Appris ! Continue comme ça","lr.teaser":"La bouchée de savoir du jour","lr.go":"Apprendre","lr.goStar":"Apprendre · +0,5 ⭐","lr.doneToday":"✓ Déjà appris aujourd'hui – encore une ?","lr.lessons":[["Le principe de l'assiette", ["La moitié de l'assiette : des légumes et un peu de fruits.", "Un quart : des céréales complètes – pain complet, riz complet, pâtes complètes ou pommes de terre.", "Un quart : des protéines – légumineuses, poisson, œufs, produits laitiers ou viande maigre."], "Quelle part de l'assiette devraient occuper les légumes et les fruits ?", ["Un quart", "La moitié", "Trois quarts"], 1, "La moitié – ça rassasie, apporte beaucoup de vitamines et de fibres et fait économiser des calories."], ["Bien boire", ["Un adulte devrait boire environ 1,5 litre par jour – plus quand il fait chaud ou avec le sport.", "Le mieux : de l'eau et du thé non sucré.", "Astuce : un verre d'eau à chaque repas – et une bouteille bien en vue."], "Combien un adulte devrait-il boire environ par jour ?", ["0,5 litre", "1,5 litre", "4 litres"], 1, "Environ 1,5 litre suffit en général – davantage les jours de chaleur ou de sport."], ["Le sucre caché", ["L'OMS conseille au maximum 10 % de l'énergie en sucres libres, idéalement moins de 5 % – environ 25 g (6 cuillères à café).", "Le sucre se cache souvent dans les sodas, yaourts aux fruits, céréales, ketchup et sauces.", "De l'eau au lieu d'un soda, c'est le geste le plus simple."], "Combien de sucre contient environ une canette de cola (33 cl) ?", ["3 morceaux de sucre", "11 morceaux de sucre", "25 morceaux de sucre"], 1, "Environ 35 g de sucre – déjà plus que les 25 g que l'OMS donne comme limite idéale pour toute la journée."], ["Les fibres", ["On recommande au moins 30 g par jour – la plupart en mangent bien moins.", "Bonnes sources : céréales complètes, légumineuses, légumes, fruits et noix.", "Elles rassasient longtemps, aident la digestion et stabilisent la glycémie. Bois assez avec !"], "Quel pain contient le plus de fibres ?", ["Pain blanc", "Pain complet", "Croissant"], 1, "Le pain complet – le grain entier contient le plus de fibres, de vitamines et de minéraux."], ["Les bonnes graisses", ["Les graisses insaturées sont bonnes pour le cœur : huiles de colza et d'olive, noix, avocat.", "Les poissons gras (saumon, hareng…) apportent des oméga-3 – du poisson une à deux fois par semaine, c'est une bonne idée.", "Moins de : charcuterie, fritures, viennoiseries et graisses hydrogénées."], "Quelle graisse est particulièrement bonne pour le cœur ?", ["L'huile de colza", "La graisse de palme", "Le beurre clarifié"], 0, "L'huile de colza – riche en graisses insaturées et même en oméga-3 végétaux."], ["Les protéines", ["Un adulte a besoin d'environ 0,8 g de protéines par kg de poids par jour (dès 65 ans, environ 1 g).", "Pour 70 kg, cela fait environ 56 g – par ex. un yaourt, une portion de lentilles et un peu de fromage.", "Sources végétales : lentilles, haricots, pois chiches, tofu, céréales complètes. Les protéines rassasient."], "De combien de protéines un adulte a-t-il besoin environ par jour ?", ["0,8 g par kg de poids", "3 g par kg de poids", "10 g au total"], 0, "Environ 0,8 g par kg – la plupart n'ont pas besoin de plus, et c'est facile à répartir sur la journée."], ["Moins de sel", ["On recommande au maximum environ 5 à 6 g de sel par jour – à peu près une cuillère à café.", "La plupart du sel se trouve déjà dans le pain, le fromage, la charcuterie et les plats préparés.", "Assaisonne avec des herbes, des épices, de l'ail ou du citron – le goût s'habitue vite."], "D'où vient la plus grande partie du sel que nous mangeons ?", ["De la salière", "Du pain, du fromage, de la charcuterie et des plats préparés", "Des fruits et légumes"], 1, "Des aliments transformés – la salière n'en représente qu'une petite partie."], ["Les aliments ultra-transformés", ["Ce sont des produits industriels avec beaucoup d'additifs comme des arômes et des émulsifiants.", "Ils contiennent souvent beaucoup de sucre, de gras et de sel, et on en mange facilement trop.", "Astuce : choisir des listes d'ingrédients courtes et cuisiner plus souvent – chaque plat fait maison te rapporte une étoile dans FitTag."], "Comment reconnaît-on souvent un aliment ultra-transformé ?", ["Une longue liste d'ingrédients avec des additifs", "Il est surgelé", "Il vient du marché"], 0, "À sa longue liste d'ingrédients. Les légumes surgelés sans additifs, eux, sont peu transformés et très sains."], ["Manger lentement", ["La sensation de satiété n'arrive qu'après environ 20 minutes.", "Manger lentement aide souvent à manger moins – sans avoir faim.", "Astuce : poser la fourchette entre les bouchées, bien mâcher et manger sans téléphone ni télé."], "Combien de temps faut-il environ pour que la satiété arrive ?", ["2 minutes", "20 minutes", "2 heures"], 1, "Environ 20 minutes – ça vaut donc la peine d'attendre un peu avant de se resservir."], ["Manger coloré – 5 par jour", ["« 5 par jour » : 3 portions de légumes et 2 portions de fruits.", "Une portion, c'est environ une poignée.", "Des couleurs différentes apportent des vitamines et des composés végétaux différents – les légumes surgelés comptent aussi."], "Pour « 5 par jour », quelle est à peu près la taille d'une portion ?", ["Une poignée", "Une cuillère à café", "Une assiette entière"], 0, "Une poignée – pratique, car la main grandit avec nous : les enfants ont besoin de portions plus petites."], ["Sommeil et faim", ["Le manque de sommeil augmente l'hormone de la faim (ghréline) et diminue celle de la satiété (leptine).", "Résultat : plus d'envies de sucré et de gras.", "La caféine agit longtemps – après environ 5 heures, seule la moitié est éliminée. C'est pour ça que FitTag a une limite pour le café."], "Que se passe-t-il souvent après un manque de sommeil ?", ["Plus d'envies de sucré et de gras", "Moins de faim", "Rien du tout"], 0, "Plus d'envies – bien dormir (souvent 7 à 9 heures pour un adulte) aide donc aussi à bien manger."], ["Faire ses courses malin", ["Faire les courses avec une liste et sans avoir faim – ça évite les achats impulsifs.", "Les ingrédients sont classés par quantité – le premier est celui qu'il y a le plus.", "Comparer le sucre et le sel pour 100 g ; le Nutri-Score aide à s'orienter."], "Que signifie le sucre en tête de la liste des ingrédients ?", ["Il y a beaucoup de sucre", "Il y a peu de sucre", "Le sucre est juste décoratif"], 0, "Les ingrédients sont classés par quantité – ce qui vient en premier est présent en plus grande quantité."], ["Un bon petit-déjeuner", ["Protéines et fibres rassasient longtemps – par ex. flocons d'avoine avec yaourt et fruits, pain complet avec un œuf ou du fromage blanc.", "Les céréales sucrées et viennoiseries redonnent souvent vite faim.", "Pas faim le matin ? Inutile de te forcer – prévois simplement un snack sain pour plus tard."], "Quel petit-déjeuner rassasie le plus longtemps ?", ["Croissant à la confiture", "Flocons d'avoine avec yaourt et fruits", "Juste un café"], 1, "Les flocons d'avoine avec yaourt et fruits – fibres et protéines ensemble rassasient particulièrement longtemps."], ["Snacks au travail", ["Prévois tes snacks : une poignée de noix, un fruit, des bâtonnets de légumes avec du houmous ou un yaourt.", "Les sucreries hors de vue – on mange plus facilement ce qu'on voit.", "Une bouteille d'eau sur le bureau aide à ne pas confondre soif et faim."], "Qu'est-ce qui aide le mieux contre le piège des sucreries au bureau ?", ["Avoir des snacks sains à portée de main", "Ne rien manger de la journée", "Garder du chocolat dans le tiroir"], 0, "Des snacks sains à portée de main – quand on est préparé, on craque moins souvent pour le sucré."], ["Manger au restaurant", ["Grillé, vapeur ou au four est souvent plus léger que frit ou pané.", "Demande la sauce à part – c'est toi qui choisis la quantité.", "Bois de l'eau, remplace l'accompagnement par de la salade ou des légumes et partage volontiers le dessert."], "Quel mode de cuisson est le plus souvent le choix léger ?", ["Frit", "Grillé ou à la vapeur", "Pané"], 1, "Grillé ou à la vapeur – on ajoute beaucoup moins de gras qu'en friture ou en panure."], ["Boissons & alcool", ["Un gramme d'alcool contient environ 7 kcal – presque autant que le gras.", "Un demi-litre de bière contient environ 200 kcal, un verre de vin (20 cl) environ 150 kcal.", "Pour la santé : moins il y a d'alcool, mieux c'est. Astuce : un verre d'eau avec chaque verre."], "Combien de calories contient environ un gramme d'alcool ?", ["1 kcal", "7 kcal", "20 kcal"], 1, "Environ 7 kcal – plus que le sucre ou les protéines (environ 4 kcal chacun) et presque autant que le gras (9 kcal)."], ["Les fringales", ["Les fringales viennent souvent par vagues et s'affaiblissent après quelques minutes.", "Bois un verre d'eau, attends 10 minutes ou prends l'air.", "Des repas réguliers et rassasiants sont la meilleure prévention."], "Qu'est-ce qui aide souvent contre une fringale ?", ["Un verre d'eau et attendre 10 minutes", "Manger toute la tablette tout de suite", "Sauter des repas"], 0, "De l'eau et un peu de patience – l'envie diminue souvent nettement."], ["Cuisiner à l'avance", ["Cuisine une plus grande quantité et répartis-la en portions pour les jours suivants.", "Les restes cuits se conservent en général 2 à 3 jours au réfrigérateur, bien plus longtemps au congélateur.", "Ainsi, tu as quelque chose de sain même les jours chargés – et ça compte comme fait maison !"], "Combien de temps se conservent en général les restes cuits au réfrigérateur ?", ["2 à 3 jours", "2 semaines", "1 mois"], 0, "En général 2 à 3 jours. Ce que tu veux garder plus longtemps, congèle-le tout de suite."], ["Végétarien & végétal", ["Plus de végétaux dans l'assiette, c'est bon pour la santé et pour le climat.", "Légumineuses et céréales combinées apportent des protéines de qualité – par ex. lentilles et riz.", "En alimentation végane, il faut une supplémentation en vitamine B12. Le fer végétal est mieux absorbé avec de la vitamine C (par ex. poivron)."], "Quelle vitamine les végans doivent-ils compléter ?", ["Vitamine C", "Vitamine B12", "Vitamine A"], 1, "La vitamine B12 – on la trouve presque uniquement dans les aliments d'origine animale."], ["Manger de saison", ["Les fruits et légumes de saison sont souvent plus frais, plus savoureux et moins chers.", "En hiver, en Europe centrale, c'est la saison du chou kale, du chou rouge, des carottes, de la betterave et des pommes.", "Les légumes surgelés sont une bonne alternative – ils sont congelés juste après la récolte."], "Quel légume est de saison en hiver en Allemagne ?", ["Le chou kale", "L'asperge", "La courgette"], 0, "Le chou kale – l'asperge, c'est au printemps, la courgette en été."], ["Les portions avec la main", ["Protéines (viande, poisson, tofu) : environ une paume.", "Accompagnements comme riz ou pâtes : environ un poing. Légumes : deux mains pleines.", "Matières grasses comme beurre ou huile : environ un pouce. De plus petites assiettes aident aussi."], "Quelle portion de main correspond à peu près aux matières grasses comme le beurre ou l'huile ?", ["La taille d'un pouce", "La taille d'un poing", "Deux mains pleines"], 0, "La taille d'un pouce – le gras est très énergétique, une petite quantité suffit."], ["Lire les étiquettes", ["Compare toujours les valeurs nutritionnelles pour 100 g – tu vois tout de suite les différences.", "Un aliment peut être dit « pauvre en sucres » s'il contient au maximum 5 g de sucres pour 100 g.", "« Light » signifie seulement au moins 30 % de moins de quelque chose – pas forcément peu calorique."], "Que signifie « light » sur l'emballage ?", ["Sans calories", "Au moins 30 % de moins de quelque chose que des produits comparables", "Qualité bio"], 1, "Au moins 30 % de moins d'un nutriment (par ex. le gras) – le produit peut quand même être très calorique."], ["Manger sous stress", ["Le stress peut donner envie de sucré et de gras.", "Demande-toi un instant : ai-je vraiment faim – ou suis-je stressé·e, fatigué·e ou en train de m'ennuyer ?", "Une courte marche, quelques respirations profondes ou une conversation aident aussi contre le stress."], "Quelle question aide face au grignotage de stress ?", ["Ai-je vraiment faim – ou suis-je stressé·e ?", "Qu'est-ce qui est le plus sucré ?", "À quelle vitesse puis-je manger ?"], 0, "Cette courte pause aide à distinguer la vraie faim du stress."], ["Du sucré sans culpabilité", ["Les interdits stricts rendent souvent l'envie plus forte.", "Savoure le sucré en pleine conscience : une petite portion dans une assiette, assis·e, sans distraction.", "Règle simple : le plus souvent sain, parfois plaisir – c'est à ça que sert le joker plaisir de FitTag."], "Qu'est-ce qui aide à savourer le sucré sereinement ?", ["Savourer consciemment une petite portion", "L'interdire complètement", "Le manger en cachette debout"], 0, "En pleine conscience et au calme – souvent, une petite portion suffit alors."]],
      "lr.rev":"🔁 Question de révision du jour","lr.revSub":"Tu as tout appris ! Chaque jour, une question sur une ancienne bouchée – une bonne réponse rapporte +0,5 ⭐.","lr.revDone":"✓ Déjà révisé aujourd'hui – nouvelle question demain.","lr.revGo":"Quiz · +0,5 ⭐","lr.revWrong":"Pas tout à fait – la bonne réponse : {a}","lr.revTeaser":"Question de révision du jour","tour3":[["👋 Bienvenue sur FitTag !", "Ravi de te voir ! En une minute, je te montre tout. Comment t'appelles-tu – et dans quelle langue veux-tu utiliser FitTag ?", "heute/home"], ["🌳 Ton personnage dans le parc", "Il montre comment se passe ta journée : bois, mange et bouge sainement et il devient en forme et joyeux – sinon fatigué. La météo réagit aussi : peu d'eau = sécheresse ☀️, beaucoup de malbouffe = orage ⛈️. Appuie dessus pour des figures ; dans « Apparence », tu le personnalises et choisis un animal ou un·e partenaire. Chaque portion de fruits & légumes plante une fleur dans ton parc. L'énergie vitale et l'horloge de vie ne sont que des valeurs de jeu – pas une vraie prévision.", "heute/home"], ["💬 Parle-lui !", "Appuie sur 💬 dans le parc et dis à ton personnage comment tu vas – il écoute et répond à voix haute. Partenaire et animal participent aussi. Plus bas, tu trouves aussi la bouchée de savoir du jour.", "heute/home"], ["✅ Noter", "Coche ici l'eau, les fruits & légumes, les plats faits maison, le café (avec ton heure limite), les pas, l'activité et l'humeur – avec + et −. Le plus rapide : 🎤 – dis simplement ce que tu as fait.", "heute/log"], ["🍽️ Repas", "Choisis petit-déjeuner, déjeuner, dîner ou snack. Pour les snacks, touche simplement les sains ou les moins sains. Tu peux aussi photographier ou dicter tes repas – FitTag estime les calories. Cuisiné toi-même ? Touche 🏠 Fait maison.", "essen/analyze"], ["💡 Idées & courses", "Demande des idées de repas, scanne menus ou étiquettes, parcours les recettes, planifie ta semaine et ajoute les ingrédients directement à ta liste de courses.", "essen/ideas"], ["📚 Savoir", "24 petites bouchées de savoir sur l'alimentation saine – lire, répondre à une question, c'est tout. La première nouvelle bouchée du jour rapporte une demi-étoile de voyage ⭐.", "essen/learn"], ["🎯 Mon objectif", "Fixe-toi un objectif : perdre des kilos, de la masse grasse, du tour de taille, une taille de vêtement – ou simplement manger plus sainement. Avec tirelire, bingo et victoires.", "diet"], ["🚆 Le voyage à travers l'Europe", "Tout ce qui est sain rapporte des étoiles de voyage ⭐ – eau, légumes, activité, fait maison et plus. Toutes les 4 étoiles, tu arrives dans une nouvelle ville avec sa propre aventure. Dans le compartiment, tu peux parler à tout le monde, et en route t'attendent problèmes d'échecs, memory et quiz.", "diet"], ["🏆 Points & ligue", "Tout ce qui est sain rapporte des points, des niveaux et un défi du jour. Réussis 5 défis par semaine pour ouvrir une boîte surprise 🎁. Dans la ligue, tu affrontes des bots – et tes amis via un code ami.", "liga"], ["💼 Bureau & pauses", "De courts exercices pour la journée – ton personnage te les montre. Si tu veux, FitTag te rappelle de faire des pauses.", "heute/office"], ["👤 Profil", "Règle ici tes objectifs du jour, retrouve calendrier, image du mois et rétrospective dans « 📊 Ma semaine », et active ou non météo, mode nuit ou routine du soir.", "ziele"], ["👉 C'est parti !", "Glisse à gauche ou à droite pour changer de page. Le bouton rond 🎤 en bas à droite est toujours là pour toi. Amuse-toi bien avec FitTag !", "heute/home"]],
      "tourS":[["👋 Bienvenue sur FitTag !", "Ravi de te voir ! Comment t'appelles-tu – et dans quelle langue veux-tu utiliser FitTag ?", "heute/home"], ["🌳 Ton personnage", "Il montre comment se passe ta journée : vis sainement et il devient en forme et joyeux. Touche-le pour des figures, touche 💬 pour lui parler. Chaque portion de fruits & légumes plante une fleur dans ton parc. L'énergie vitale et l'horloge de vie ne sont que des valeurs de jeu – pas une vraie prévision.", "heute/home"], ["👉 Et maintenant ?", "Glisse à gauche ou à droite pour changer de page. Le bouton 🎤 est toujours là pour toi. Tu veux commencer tout de suite – ou d'abord tout voir ?", "heute/home"]],"ptips":{"heute/log": ["✅ Noter", "Coche avec + et − : eau, fruits & légumes, fait maison, café, pas, activité et humeur. Encore plus rapide : 🎤 – dis simplement ce que tu as fait."], "heute/office": ["💼 Bureau", "De courts exercices pour la journée – ton personnage te les montre. Si tu veux, FitTag te rappelle de faire des pauses."], "essen/analyze": ["🍽️ Mes repas", "Choisis le repas, touche simplement les snacks ou prends ton plat en photo – FitTag estime les calories. Cuisiné toi-même ? Touche 🏠."], "essen/ideas": ["💡 Idées", "Demande des idées de plats ou scanne un menu. Les ingrédients vont sur ta liste de courses en un geste."], "essen/recipes": ["📖 Recettes", "Des recettes saines à parcourir. Tu en as cuisiné une ? Ajoute-la d'un geste."], "essen/plan": ["🗓️ Plan", "Planifie tes repas de la semaine – ça fait gagner du temps et évite les achats impulsifs."], "essen/shop": ["🛒 Courses", "Ta liste de courses, triée par rayon. Coche ce qui est déjà dans le chariot."], "essen/learn": ["📚 Savoir", "De petites bouchées de savoir sur l'alimentation saine : lire, répondre à une question, c'est tout. La première nouvelle du jour rapporte +0,5 ⭐ pour le voyage."], "diet": ["🎯 Mon objectif", "Fixe-toi un objectif – perdre du poids, du tour de taille ou simplement manger plus sainement. En haut, tu passes d'Aujourd'hui à la tirelire, au voyage, au bingo et plus."], "diet/trip": ["🚆 Le voyage", "Tout ce qui est sain rapporte des étoiles de voyage ⭐. Toutes les 4 étoiles, tu arrives dans une nouvelle ville avec son aventure. Dans le train, tu peux parler à tout le monde et résoudre des énigmes."], "liga": ["🏆 Ligue", "Gagne des points pour tout ce qui est sain et mesure-toi aux bots – ou à tes amis via un code ami."], "ziele": ["👤 Profil", "Règle ici tes objectifs du jour, retrouve ta semaine, le calendrier et la rétrospective, et active ou non des extras comme le mode nuit."], "heute/review": ["🗣️ Bilan", "Ici, ton personnage te raconte ta dernière semaine – avec un compliment et un petit conseil. En dessous, tes chiffres de la semaine."], "heute/play": ["🎮 Jouer", "Ici : le défi du jour, le boss de la semaine, la roue de la chance, les bouchées de savoir et la surprise de la semaine."]},"ptip.ok":"Compris 👍",

      "gl.feel":["🥗", "Zdrowiej jeść", "bez odchudzania – po prostu lepsze nawyki"],"hb.title":"🥗 Zdrowe jedzenie dziś","hb.meals":"Posiłki","hb.healthy":"zdrowe","hb.veg":"Owoce i warzywa","hb.water":"Woda","hb.good":"✅ Zdrowy dzień – +10 punktów","hb.tip":"Zdrowy dzień: co najmniej 2 posiłki, z czego co najmniej połowa zdrowa.","hb.mini":"🥗 Dziś: {a} z {b} posiłków zdrowych","hb.none":"Brak posiłków – w 🍽️ Jedzenie dodasz je zdjęciem, głosem lub tekstem.",

      "sp.sub":"Po prostu powiedz, co zjadłaś/eś, wypiłaś/eś i zrobiłaś/eś – FitTag wszystko wpisze.","sp.btn":"🎤 Mów teraz",
      "tour3":[["👋 Witaj w FitTag!", "Miło cię widzieć! W minutę pokażę ci wszystko. Jak masz na imię – i w jakim języku chcesz używać FitTag?", "heute/home"], ["🌳 Twoja postać w parku", "Pokazuje, jak mija ci dzień: pij, jedz i ruszaj się zdrowo, a będzie w formie i wesoła – inaczej zmęczona. Pogoda też reaguje: mało wody = susza ☀️, dużo niezdrowych rzeczy = burza ⛈️. Dotknij jej, by zobaczyć sztuczki; w „Wygląd” ją zmienisz i wybierzesz zwierzaka lub partnera. Każda porcja owoców i warzyw sadzi kwiat w twoim parku. Energia życiowa i zegar życia to tylko wartości z gry – nie prawdziwa prognoza.", "heute/home"], ["💬 Porozmawiaj z nią!", "Dotknij 💬 w parku i powiedz postaci, jak się czujesz – słucha i odpowiada na głos. Partner i zwierzak też się włączają. Dotknij myśli dnia, a zostanie przeczytana.", "heute/home"], ["✅ Wpisy", "Tu wpisujesz wodę, owoce i warzywa, kroki, ruch i nastrój – przyciskami + i −. Najszybciej: 🎤 „Mów teraz” i po prostu powiedz, co robiłaś/eś.", "heute/log"], ["🍽️ Jedzenie", "Zrób zdjęcie posiłku, powiedz lub napisz – FitTag oszacuje kalorie i pokaże wskazówki zdrowotne, np. cukier, sól czy błonnik.", "essen/analyze"], ["💡 Pomysły i zakupy", "Poproś o pomysły na posiłki, skanuj menu lub etykiety w sklepie, przeglądaj przepisy, planuj tydzień i prowadź listę zakupów.", "essen/ideas"], ["🎯 Mój cel", "Wyznacz cel: kilogramy, tkanka tłuszczowa, obwód brzucha, rozmiar ubrań – albo po prostu zdrowsze jedzenie. Do tego skarbonka, podróż pociągiem po Europie, bingo i sukcesy.", "diet"], ["🏆 Punkty i liga", "Za wszystko, co zdrowe, dostajesz punkty, poziomy i wyzwanie dnia. 5 wyzwań w tygodniu otwiera pudełko niespodzianek 🎁. W lidze grasz z botami – i ze znajomymi przez kod znajomego.", "liga"], ["💼 Biuro i przerwy", "Krótkie ćwiczenia na co dzień – twoja postać je pokazuje. Jeśli chcesz, FitTag przypomni o przerwach.", "heute/office"], ["👤 Profil", "Tu ustawisz dzienne cele, znajdziesz kalendarz, obrazek miesiąca i podsumowanie roku w „📊 Mój tydzień” oraz włączysz lub wyłączysz pogodę, tryb nocny czy wieczorną rutynę.", "ziele"], ["👉 Gotowe – zaczynamy!", "Przesuń w lewo lub w prawo, aby zmieniać strony. Okrągły przycisk 🎤 w prawym dolnym rogu jest zawsze dla ciebie. Miłej zabawy z FitTag!", "heute/home"]],"tour.name":"Twoje imię","tour.lang":"Język",

      "sub.learn":"📚 Wiedza","lr.title":"📚 Porcje wiedzy","lr.sub":"Krótko przeczytaj, odpowiedz na jedno pytanie – gotowe. Pierwsza nowa porcja dziennie daje +0,5 ⭐ do podróży.","lr.prog":"Nauczone: {n} z {m}","lr.all":"🎓 Wszystko nauczone – jesteś ekspertem od żywienia! Możesz powtarzać pytania w każdej chwili.","lr.wrong":"Nie do końca – przeczytaj punkty jeszcze raz.","lr.retry":"🔁 Spróbuj jeszcze raz","lr.toastStar":"📚 Nauczone! +0,5 ⭐ do podróży","lr.toast":"📚 Nauczone! Tak trzymaj","lr.teaser":"Porcja wiedzy na dziś","lr.go":"Ucz się","lr.goStar":"Ucz się · +0,5 ⭐","lr.doneToday":"✓ Dziś już nauczone – może jeszcze jedna?","lr.lessons":[["Zasada talerza", ["Połowa talerza: warzywa i trochę owoców.", "Ćwierć: produkty pełnoziarniste – np. chleb razowy, brązowy ryż, makaron pełnoziarnisty lub ziemniaki.", "Ćwierć: białko – rośliny strączkowe, ryba, jajka, nabiał lub chude mięso."], "Jaką część talerza powinny zajmować warzywa i owoce?", ["Ćwierć", "Połowę", "Trzy czwarte"], 1, "Połowę – sycą, dostarczają dużo witamin i błonnika, a przy okazji oszczędzasz kalorie."], ["Dobre nawadnianie", ["Dorośli powinni pić około 1,5 litra dziennie – więcej w upał lub przy sporcie.", "Najlepiej: woda i niesłodzona herbata.", "Trik: szklanka wody do każdego posiłku – i butelka w widocznym miejscu."], "Ile mniej więcej powinien pić dorosły dziennie?", ["0,5 litra", "1,5 litra", "4 litry"], 1, "Około 1,5 litra zwykle wystarczy – w upalne dni lub przy sporcie odpowiednio więcej."], ["Ukryty cukier", ["WHO zaleca maksymalnie 10% energii z cukrów wolnych, najlepiej poniżej 5% – to około 25 g (6 łyżeczek).", "Cukier często kryje się w napojach, jogurtach owocowych, płatkach, ketchupie i sosach.", "Woda zamiast słodkiego napoju to najprostszy krok."], "Ile mniej więcej cukru jest w puszce coli (0,33 l)?", ["3 kostki cukru", "11 kostek cukru", "25 kostek cukru"], 1, "Około 35 g cukru – już więcej niż 25 g, które WHO podaje jako idealny limit na cały dzień."], ["Błonnik", ["Zaleca się co najmniej 30 g dziennie – większość je znacznie mniej.", "Dobre źródła: produkty pełnoziarniste, strączki, warzywa, owoce i orzechy.", "Długo syci, wspiera trawienie i stabilizuje poziom cukru we krwi. Pij przy tym dużo!"], "Który chleb ma najwięcej błonnika?", ["Chleb pszenny", "Chleb razowy", "Rogalik"], 1, "Chleb razowy – całe ziarno zawiera najwięcej błonnika, witamin i minerałów."], ["Dobre tłuszcze", ["Tłuszcze nienasycone są dobre dla serca: olej rzepakowy i oliwa, orzechy, awokado.", "Tłuste ryby morskie (np. łosoś, śledź) dostarczają omega-3 – ryba raz lub dwa razy w tygodniu to dobry pomysł.", "Mniej: wędlin, smażonych potraw, słodkich wypieków i tłuszczów utwardzonych."], "Który tłuszcz jest szczególnie korzystny dla serca?", ["Olej rzepakowy", "Tłuszcz palmowy", "Masło klarowane"], 0, "Olej rzepakowy – ma dużo tłuszczów nienasyconych, a nawet trochę roślinnych omega-3."], ["Białko", ["Dorośli potrzebują około 0,8 g białka na kg masy ciała dziennie (po 65. roku życia ok. 1 g).", "Przy 70 kg to około 56 g – np. jogurt, porcja soczewicy i trochę sera.", "Źródła roślinne: soczewica, fasola, ciecierzyca, tofu, pełne ziarna. Białko długo syci."], "Ile mniej więcej białka potrzebuje dorosły dziennie?", ["0,8 g na kg masy ciała", "3 g na kg masy ciała", "10 g łącznie"], 0, "Około 0,8 g na kg – większość nie potrzebuje więcej, a łatwo to rozłożyć na cały dzień."], ["Mniej soli", ["Zaleca się maksymalnie około 5–6 g soli dziennie – mniej więcej łyżeczkę.", "Najwięcej soli jest już w chlebie, serze, wędlinach i gotowych daniach.", "Przyprawiaj ziołami, przyprawami, czosnkiem lub cytryną – smak szybko się przyzwyczaja."], "Skąd pochodzi większość soli, którą jemy?", ["Z solniczki", "Z chleba, sera, wędlin i gotowych dań", "Z owoców i warzyw"], 1, "Z żywności przetworzonej – solniczka to tylko niewielka część."], ["Żywność wysoko przetworzona", ["To produkty przemysłowe z wieloma dodatkami, np. aromatami i emulgatorami.", "Często zawierają dużo cukru, tłuszczu i soli, a łatwo zjeść ich za dużo.", "Wskazówka: wybieraj krótkie listy składników i częściej gotuj sam(a) – każde domowe danie daje ci w FitTag gwiazdkę."], "Po czym często poznasz żywność wysoko przetworzoną?", ["Po długiej liście składników z dodatkami", "Jest mrożona", "Pochodzi z targu"], 0, "Po długiej liście składników. Mrożone warzywa bez dodatków są natomiast mało przetworzone i bardzo zdrowe."], ["Jedz powoli", ["Uczucie sytości pojawia się dopiero po około 20 minutach.", "Kto je powoli, często je mniej – i nie zostaje głodny.", "Wskazówka: odkładaj widelec między kęsami, dobrze przeżuwaj i jedz bez telefonu i telewizora."], "Po jakim czasie mniej więcej pojawia się uczucie sytości?", ["Po 2 minutach", "Po 20 minutach", "Po 2 godzinach"], 1, "Po około 20 minutach – warto więc chwilę odczekać przed dokładką."], ["Jedz kolorowo – 5 razy dziennie", ["„5 porcji dziennie”: 3 porcje warzyw i 2 porcje owoców.", "Jedna porcja to mniej więcej garść.", "Różne kolory to różne witaminy i substancje roślinne – mrożone warzywa też się liczą."], "Jak duża jest mniej więcej jedna porcja w „5 porcjach dziennie”?", ["Garść", "Łyżeczka", "Cały talerz"], 0, "Garść – wygodne, bo dłoń rośnie razem z nami: dzieci potrzebują mniejszych porcji."], ["Sen i głód", ["Za mało snu podnosi hormon głodu (grelinę) i obniża hormon sytości (leptynę).", "Skutek: większa ochota na słodkie i tłuste.", "Kofeina działa długo – po około 5 godzinach rozkłada się dopiero połowa. Dlatego FitTag ma limit kawy."], "Co często dzieje się po zbyt krótkim śnie?", ["Większa ochota na słodkie i tłuste", "Mniejszy głód", "Nic"], 0, "Większa ochota – wystarczająca ilość snu (dla dorosłych zwykle 7–9 godzin) pomaga więc także zdrowo jeść."], ["Mądre zakupy", ["Rób zakupy z listą i nie na głodnego – to oszczędza pieniądze i zakupy pod wpływem impulsu.", "Składniki są podane według ilości – na początku jest to, czego jest najwięcej.", "Porównuj cukier i sól na 100 g; Nutri-Score pomaga się zorientować."], "Co oznacza cukier na samym początku listy składników?", ["Jest w produkcie bardzo dużo cukru", "Jest mało cukru", "Cukier jest tylko dekoracją"], 0, "Składniki są ułożone według ilości – to, co jest na początku, jest w produkcie w największej ilości."], ["Dobre śniadanie", ["Białko i błonnik długo sycą – np. płatki owsiane z jogurtem i owocami, chleb razowy z jajkiem lub twarożkiem.", "Słodzone płatki i słodkie wypieki zwykle szybko pobudzają głód.", "Rano nie jesteś głodna/y? Nie musisz się zmuszać – zaplanuj po prostu zdrową przekąskę na później."], "Które śniadanie syci najdłużej?", ["Rogalik z dżemem", "Płatki owsiane z jogurtem i owocami", "Sama kawa"], 1, "Płatki owsiane z jogurtem i owocami – połączenie błonnika i białka syci szczególnie długo."], ["Przekąski w pracy", ["Zaplanuj przekąski: garść orzechów, owoc, warzywa w słupkach z hummusem albo jogurt.", "Słodycze poza zasięgiem wzroku – jemy chętniej to, co widzimy.", "Butelka wody na biurku pomaga nie mylić pragnienia z głodem."], "Co najbardziej pomaga uniknąć słodyczy w biurze?", ["Zdrowe przekąski pod ręką", "Nie jeść nic przez cały dzień", "Czekolada w szufladzie"], 0, "Zdrowe przekąski pod ręką – kto jest przygotowany, rzadziej sięga po słodycze."], ["Jedzenie na mieście", ["Grillowane, gotowane na parze lub pieczone jest zwykle lżejsze niż smażone czy panierowane.", "Poproś o sos osobno – wtedy sam(a) decydujesz o ilości.", "Pij wodę, zamień dodatek na sałatkę lub warzywa i chętnie dziel się deserem."], "Który sposób przygotowania jest zwykle lżejszy?", ["Smażony", "Grillowany lub na parze", "Panierowany"], 1, "Grillowany lub na parze – dodaje się dużo mniej tłuszczu niż przy smażeniu czy panierowaniu."], ["Napoje i alkohol", ["Gram alkoholu ma około 7 kcal – prawie tyle co tłuszcz.", "Pół litra piwa to około 200 kcal, kieliszek wina (0,2 l) około 150 kcal.", "Dla zdrowia: im mniej alkoholu, tym lepiej. Wskazówka: do każdego kieliszka szklanka wody."], "Ile mniej więcej kalorii ma gram alkoholu?", ["1 kcal", "7 kcal", "20 kcal"], 1, "Około 7 kcal – więcej niż cukier czy białko (po ok. 4 kcal) i prawie tyle co tłuszcz (9 kcal)."], ["Napady głodu", ["Ochota na jedzenie często przychodzi falami i słabnie po kilku minutach.", "Wypij szklankę wody, odczekaj 10 minut albo wyjdź na świeże powietrze.", "Regularne, sycące posiłki najlepiej zapobiegają napadom głodu."], "Co często pomaga przy napadzie głodu?", ["Szklanka wody i 10 minut czekania", "Od razu zjeść całą tabliczkę", "Pomijać posiłki"], 0, "Woda i chwila cierpliwości – ochota często wyraźnie słabnie."], ["Gotowanie na zapas", ["Ugotuj większą ilość i podziel na porcje na kolejne dni.", "Ugotowane resztki zwykle wytrzymują w lodówce 2–3 dni, zamrożone znacznie dłużej.", "Dzięki temu nawet w zabiegane dni masz coś zdrowego – i liczy się to jako domowe!"], "Jak długo zwykle wytrzymują ugotowane resztki w lodówce?", ["2–3 dni", "2 tygodnie", "1 miesiąc"], 0, "Zwykle 2–3 dni. To, co chcesz przechować dłużej, najlepiej od razu zamrozić."], ["Wegetariańsko i roślinnie", ["Więcej roślin na talerzu to korzyść dla zdrowia i klimatu.", "Strączki w połączeniu ze zbożami dają pełnowartościowe białko – np. soczewica z ryżem.", "Na diecie wegańskiej trzeba suplementować witaminę B12. Żelazo z roślin lepiej się wchłania z witaminą C (np. papryką)."], "Którą witaminę muszą suplementować weganie?", ["Witaminę C", "Witaminę B12", "Witaminę A"], 1, "Witaminę B12 – występuje prawie wyłącznie w produktach zwierzęcych."], ["Jedz sezonowo", ["Sezonowe owoce i warzywa są często świeższe, smaczniejsze i tańsze.", "Zimą w Europie Środkowej sezon mają np. jarmuż, czerwona kapusta, marchew, buraki i jabłka.", "Mrożone warzywa to dobra alternatywa – mrozi się je zaraz po zbiorze."], "Które warzywo ma w Niemczech sezon zimą?", ["Jarmuż", "Szparagi", "Cukinia"], 0, "Jarmuż – szparagi mają sezon wiosną, cukinia latem."], ["Porcje na dłoń", ["Białko (mięso, ryba, tofu): mniej więcej wnętrze dłoni.", "Dodatki jak ryż czy makaron: mniej więcej pięść. Warzywa: dwie garści.", "Tłuszcz jak masło czy olej: mniej więcej kciuk. Mniejsze talerze też pomagają."], "Która porcja „na dłoń” pasuje mniej więcej do tłuszczu, np. masła lub oleju?", ["Wielkość kciuka", "Wielkość pięści", "Dwie garści"], 0, "Wielkość kciuka – tłuszcz jest bardzo kaloryczny, wystarczy niewielka ilość."], ["Czytanie etykiet", ["Zawsze porównuj wartości odżywcze na 100 g – od razu widać różnice.", "Produkt może być oznaczony jako „o niskiej zawartości cukrów”, jeśli ma najwyżej 5 g cukru na 100 g.", "„Light” oznacza tylko co najmniej 30% mniej czegoś – niekoniecznie mało kalorii."], "Co oznacza „light” na opakowaniu?", ["Bez kalorii", "Co najmniej 30% mniej czegoś niż w porównywalnych produktach", "Jakość ekologiczną"], 1, "Co najmniej 30% mniej jednego składnika (np. tłuszczu) – produkt nadal może mieć dużo kalorii."], ["Jedzenie w stresie", ["Stres może wywoływać ochotę na słodkie i tłuste.", "Zapytaj się na chwilę: czy naprawdę jestem głodna/y – czy zestresowana/y, zmęczona/y lub znudzona/y?", "Na stres pomaga też krótki spacer, kilka głębokich oddechów albo rozmowa."], "Które pytanie pomaga przy jedzeniu ze stresu?", ["Czy naprawdę jestem głodna/y – czy zestresowana/y?", "Co jest najsłodsze?", "Jak szybko mogę zjeść?"], 0, "Ta krótka pauza pomaga odróżnić prawdziwy głód od stresu."], ["Słodycze bez wyrzutów sumienia", ["Surowe zakazy często zwiększają ochotę.", "Jedz słodycze uważnie: mała porcja na talerzu, na siedząco, bez rozpraszaczy.", "Zasada: zwykle zdrowo, czasem przyjemność – do tego służy w FitTag joker przyjemności."], "Co pomaga spokojnie cieszyć się słodyczami?", ["Uważnie zjeść małą porcję", "Całkowicie ich zakazać", "Jeść potajemnie na stojąco"], 0, "Uważnie i spokojnie – wtedy często wystarczy mała porcja."]],
      "lr.rev":"🔁 Pytanie powtórkowe dnia","lr.revSub":"Wszystko nauczone! Codziennie jest pytanie z wcześniejszej porcji – poprawna odpowiedź daje +0,5 ⭐.","lr.revDone":"✓ Dziś już powtórzone – jutro nowe pytanie.","lr.revGo":"Quiz · +0,5 ⭐","lr.revWrong":"Nie do końca – poprawnie: {a}","lr.revTeaser":"Pytanie powtórkowe dnia","tour3":[["👋 Witaj w FitTag!", "Miło cię widzieć! W minutę pokażę ci wszystko. Jak masz na imię – i w jakim języku chcesz używać FitTag?", "heute/home"], ["🌳 Twoja postać w parku", "Pokazuje, jak mija ci dzień: pij, jedz i ruszaj się zdrowo, a będzie w formie i wesoła – inaczej zmęczona. Pogoda też reaguje: mało wody = susza ☀️, dużo niezdrowych rzeczy = burza ⛈️. Dotknij jej, by zobaczyć sztuczki; w „Wygląd” ją zmienisz i wybierzesz zwierzaka lub partnera. Każda porcja owoców i warzyw sadzi kwiat w twoim parku. Energia życiowa i zegar życia to tylko wartości z gry – nie prawdziwa prognoza.", "heute/home"], ["💬 Porozmawiaj z nią!", "Dotknij 💬 w parku i powiedz postaci, jak się czujesz – słucha i odpowiada na głos. Partner i zwierzak też się włączają. Niżej znajdziesz też porcję wiedzy na dziś.", "heute/home"], ["✅ Wpisy", "Tu odhaczasz wodę, owoce i warzywa, domowe dania, kawę (z twoim limitem godzinowym), kroki, ruch i nastrój – przyciskami + i −. Najszybciej: 🎤 – po prostu powiedz, co robiłaś/eś.", "heute/log"], ["🍽️ Jedzenie", "Wybierz śniadanie, obiad, kolację lub przekąskę. Przekąski – zdrowe i niezdrowe – po prostu dotykasz. Posiłki możesz też sfotografować lub powiedzieć – FitTag oszacuje kalorie. Gotowane samodzielnie? Dotknij 🏠 Domowe.", "essen/analyze"], ["💡 Pomysły i zakupy", "Poproś o pomysły na posiłki, skanuj menu lub etykiety, przeglądaj przepisy, planuj tydzień i dodawaj składniki prosto na listę zakupów.", "essen/ideas"], ["📚 Wiedza", "24 krótkie porcje wiedzy o zdrowym jedzeniu – przeczytaj, odpowiedz na jedno pytanie, gotowe. Pierwsza nowa porcja dziennie daje pół gwiazdki podróży ⭐.", "essen/learn"], ["🎯 Mój cel", "Wyznacz cel: kilogramy, tkanka tłuszczowa, obwód brzucha, rozmiar ubrań – albo po prostu zdrowsze jedzenie. Do tego skarbonka, bingo i sukcesy.", "diet"], ["🚆 Podróż przez Europę", "Wszystko, co zdrowe, daje gwiazdki podróży ⭐ – woda, warzywa, ruch, domowe jedzenie i więcej. Co 4 gwiazdki docierasz do nowego miasta z własną przygodą. W przedziale możesz rozmawiać ze wszystkimi, a po drodze czekają zadania szachowe, memory i quizy.", "diet"], ["🏆 Punkty i liga", "Za wszystko, co zdrowe, dostajesz punkty, poziomy i wyzwanie dnia. 5 wyzwań w tygodniu otwiera pudełko niespodzianek 🎁. W lidze grasz z botami – i ze znajomymi przez kod znajomego.", "liga"], ["💼 Biuro i przerwy", "Krótkie ćwiczenia na co dzień – twoja postać je pokazuje. Jeśli chcesz, FitTag przypomni o przerwach.", "heute/office"], ["👤 Profil", "Tu ustawisz dzienne cele, znajdziesz kalendarz, obrazek miesiąca i podsumowanie roku w „📊 Mój tydzień” oraz włączysz lub wyłączysz pogodę, tryb nocny czy wieczorną rutynę.", "ziele"], ["👉 Gotowe – zaczynamy!", "Przesuń w lewo lub w prawo, aby zmieniać strony. Okrągły przycisk 🎤 w prawym dolnym rogu jest zawsze dla ciebie. Miłej zabawy z FitTag!", "heute/home"]],
      "tourS":[["👋 Witaj w FitTag!", "Miło cię widzieć! Jak masz na imię – i w jakim języku chcesz używać FitTag?", "heute/home"], ["🌳 Twoja postać", "Pokazuje, jak mija ci dzień: żyj zdrowo, a będzie w formie i wesoła. Dotknij jej, by zobaczyć sztuczki, dotknij 💬, by porozmawiać. Każda porcja owoców i warzyw sadzi kwiat w twoim parku. Energia życiowa i zegar życia to tylko wartości z gry – nie prawdziwa prognoza.", "heute/home"], ["👉 Co dalej?", "Przesuń w lewo lub w prawo, aby zmieniać strony. Przycisk 🎤 jest zawsze dla ciebie. Chcesz od razu zacząć – czy najpierw zobaczyć wszystko?", "heute/home"]],"ptips":{"heute/log": ["✅ Wpisy", "Odhaczaj przyciskami + i −: wodę, owoce i warzywa, domowe dania, kawę, kroki, ruch i nastrój. Jeszcze szybciej: 🎤 – po prostu powiedz, co robiłaś/eś."], "heute/office": ["💼 Biuro", "Krótkie ćwiczenia na co dzień – twoja postać je pokazuje. Jeśli chcesz, FitTag przypomni o przerwach."], "essen/analyze": ["🍽️ Moje jedzenie", "Wybierz posiłek, dotykaj przekąsek albo zrób zdjęcie jedzenia – FitTag oszacuje kalorie. Gotowane samodzielnie? Dotknij 🏠."], "essen/ideas": ["💡 Pomysły", "Poproś o propozycje dań albo zeskanuj menu. Składniki trafiają na listę zakupów jednym dotknięciem."], "essen/recipes": ["📖 Przepisy", "Zdrowe przepisy do przeglądania. Ugotowałaś/eś coś? Dodaj to jednym dotknięciem."], "essen/plan": ["🗓️ Plan", "Zaplanuj posiłki na tydzień – oszczędzasz czas i unikasz zakupów pod wpływem impulsu."], "essen/shop": ["🛒 Zakupy", "Twoja lista zakupów, posortowana według alejek w sklepie. Odhacz to, co już jest w wózku."], "essen/learn": ["📚 Wiedza", "Krótkie porcje wiedzy o zdrowym jedzeniu: przeczytaj, odpowiedz na jedno pytanie, gotowe. Pierwsza nowa dziennie daje +0,5 ⭐ do podróży."], "diet": ["🎯 Mój cel", "Wyznacz cel – schudnąć, zmniejszyć obwód brzucha albo po prostu jeść zdrowiej. Na górze przełączasz między Dziś, skarbonką, podróżą, bingo i innymi."], "diet/trip": ["🚆 Podróż", "Wszystko, co zdrowe, daje gwiazdki podróży ⭐. Co 4 gwiazdki docierasz do nowego miasta z własną przygodą. W pociągu możesz rozmawiać ze wszystkimi i rozwiązywać zagadki."], "liga": ["🏆 Liga", "Zbieraj punkty za zdrowe nawyki i rywalizuj z botami – albo ze znajomymi przez kod znajomego."], "ziele": ["👤 Profil", "Tu ustawisz dzienne cele, znajdziesz swój tydzień, kalendarz i podsumowanie oraz włączysz lub wyłączysz dodatki, np. tryb nocny."], "heute/review": ["🗣️ Podsumowanie", "Tu twoja postać opowie ci, jak minął ostatni tydzień – z pochwałą i jedną małą wskazówką. Poniżej twoje liczby z tygodnia."], "heute/play": ["🎮 Graj", "Tu znajdziesz wyzwanie dnia, bossa tygodnia, koło fortuny, porcje wiedzy i niespodziankę tygodnia."]},"ptip.ok":"Rozumiem 👍",

        stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" style="transition:stroke-dashoffset .5s"/></svg>
      <div class="val"><b>${fmt(val)}${p>=1?" ✓":""}</b><small>${t("ring.of",{n:fmt(goal)})} ${unit}</small></div></div>
      <div class="ring-label">${label}</div></div>`;

  async function shrink(file){
    // Fotos verkleinern, damit sie schnell hochgeladen werden
    let src;
    try { src = await createImageBitmap(file); }
    catch(e){
      src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    }
    const max = 1400, w = src.width, h = src.height, k = Math.min(1, max/Math.max(w,h));
    const c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
  }

  initAI();

  // ---------- Challenge des Tages ----------
  const CHALLENGES = [
    ["water",   (d,g) => d.wasser >= g.wasser],

    ["breaks3", (d) => (d.breaks||[]).length >= 3],
    ["eyes2",   (d) => (d.breaks||[]).filter(b=>b.id==="eyes").length >= 2],
    ["breath",  (d) => (d.breaks||[]).some(b=>b.id==="breath")],
    ["stand30", (d) => (+d.standMin||0) >= 30],
    ["green2",  (d) => (d.meals||[]).filter(m=>(m.hints||[]).includes("veg")).length >= 2],
    ["recipe",  (d) => (d.meals||[]).some(m=>String(m.text||"").startsWith("📖"))],
    ["nojunk",  (d) => !(+d.junk) && (d.meals||[]).length >= 2 && !(d.meals||[]).some(m=>(m.hints||[]).some(c=>["junk","fried","processed"].includes(c)))],

    ["stairs", null], ["outside", null], ["phone", null], ["swap", null], ["newveg", null]
  ];
  function challengeFor(key){
    let h = 7; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return CHALLENGES[h % CHALLENGES.length];
  }
  function renderChallenge(){
    if (!$("#chCard")) return;
    const key = keyFor(offset), [id, check] = challengeFor(key), d = peek(offset), g = state.goals;
    let done = check ? !!check(d, g) : !!d.chManual;
    if (state.days[key] && !!state.days[key].chDone !== done){ state.days[key].chDone = done; save(); }
    else if (!state.days[key] && done){ dayOf(offset).chDone = true; save(); }
    $("#chText").textContent = t("ch."+id);
    $("#chState").innerHTML = done
      ? `<span class="chok">${t("ch.done")}</span>${!check ? ` <button class="linkbtn" id="chUndo">${t("ch.undo")}</button>` : ""}`

  // ---------- Serie mit Schutz ----------
  function streakInfo(){
    let streak = 0, freezeAt = null;
    for (let o = 0; o < 400; o++){
      const d = state.days[keyFor(o)];
      const active = d && dayGame(d).hits > 0;
      if (active){ streak++; continue; }
      if (o === 0) continue;                                  // heute zählt erst, wenn etwas geschafft ist
      if (freezeAt === null || freezeAt - o >= 7){ if (streak === 0 && o > 1) break; freezeAt = o; continue; }
      break;
    }
    const ready = freezeAt === null || freezeAt >= 7;
    return { streak, ready, inDays: ready ? 0 : 7 - freezeAt };
  }

  const EXS = [

    $("#exTitle").textContent = x.e + " " + t("ex."+id);

    $("#exSheet").classList.add("open");

      if (id === "breath"){
        const el = Math.min(total, (Date.now()-start)/1000), ph = Math.floor(el/4) % 4, pr = (el % 4) / 4;
        $("#exStep").textContent = t(["br.in","br.hold","br.out","br.hold"][ph]);
        const sc = ph === 0 ? .7 + .3*pr : ph === 1 ? 1 : ph === 2 ? 1 - .3*pr : .7;
        $("#exRing").style.transform = "scale(" + sc.toFixed(3) + ")";
        $("#exCount").textContent = Math.ceil(total - el) + " s";
        $("#exRing").style.setProperty("--p", (el/total*100).toFixed(1));

  function spellNums(text, lg){

- heute/home Überblick: Park mit Figur (antippen = Kunststück, 💬 = mit Figur sprechen), "✏️ Aussehen" (Figur, Partner, Haustier, Kostüm, Akzent), Titel. Liste: Stimmung, 🎯 Tagesziele (Ringe Wasser/Gemüse/Bewegung/Schritte – Ring antippen zum Eintragen), 🌙 Runterkommen (abends), ❤️ Lebensenergie & Level, ⚖️ Mein Ziel heute. Oben: Datum wechseln, 😄 Check-in (Stimmung, Schlaf). Oben rechts: Adventskalender (Dezember).
- heute/play Spielen: Challenge des Tages, Wochen-Boss (Zucker-Monster usw.), Glücksrad mit Wissensfrage, Wissenshappen, Wochen-Überraschung (5 Challenges/Woche), Events, Lebensuhr, Wichteln (Advent).
- heute/log Eintragen: 🎙️ Sprechen statt tippen, 🍽️ Essen eintragen, 💧 Schnell abhaken (Wasser, Obst & Gemüse, Hausgemacht, Kaffee mit Uhrzeit-Grenze, Alkohol), 🏃 Bewegung (Aktivität + Minuten, Schritte).
- heute/office Büro: Übungen für zwischendurch (Figur macht vor), Stehzeit, Pausen-Erinnerungen.
- heute/review Rückblick: Wochenrückblick, von der Figur vorgelesen.
ESSEN (Reiter: Essen, Ideen, Rezepte, Plan, Einkauf, Wissen)
- essen/analyze Mahlzeit eintragen: Tippen, Sprechen oder Foto (Kalorien-Schätzung), Mahlzeit, Bewertung, Hausgemacht, Snack-Chips; Liste "Heute gegessen".
- essen/ideas: Was soll ich essen?, Speisekarte scannen, Etikett scannen.
- essen/recipes: Mein Kochbuch (Rezepte speichern per Foto/Link/selbst), Selbst gekocht, Kühlschrank-Foto → Gerichte.
- essen/plan Wochenplan (Tage aufklappen, Felder antippen; KI plant Rest; Zutaten auf Einkaufsliste).
- essen/shop Einkaufsliste (hinzufügen, kopieren, Erledigtes löschen).
- essen/learn Wissen: 24 Wissenshappen in 4 Themen, je mit Quizfrage (+0,5 ⭐).
MEIN ZIEL (diet) – Reiter: Heute (Kalorien-Ring, Ideen für restliche kcal, Genuss-Joker 1×/Woche), Fortschritt (Gewicht, Körperfett, Bauch, Größe eintragen + Kurve), Motivation (Sparschwein, Zugreise durch Europa mit Sternen, Bingo, Erfolge), Einstellungen (Ziele ändern, beenden). Ziele: Kilos verlieren, Körperfett, Bauchumfang, Kleidergröße, Gesünder essen.
- Ziele: diet/today, diet/prog, diet/fun, diet/set
LIGA – Reiter: Liga (Wochen-Liga gegen Bots/Freunde, mitspielen an/aus, Bots umbenennen), Freunde (Freundescode teilen/eingeben), Erklärung (wofür es Punkte gibt). Ziele: liga/league, liga/friends, liga/rules
PROFIL (ziele): Meine Ziele (Tagesziele Wasser, Gemüse, Bewegung, Schritte), Meine Woche (Sticker-Album, Wochenansicht, Einblicke, Trophäen), Einstellungen (Sprache, Wetter, Nachtmodus, Abendroutine, Intro nochmal/kurz-lang, Nichtraucher), Daten (Sicherung exportieren/importieren). Ziel: ziele
Der runde 🎤-Knopf unten rechts: alles per Sprache eintragen.`;
  const HB_FAQ = { de: [
      ["Wo trage ich Bewegung ein?", "Am schnellsten: im Überblick auf den 🏃 Bewegungs-Ring tippen. Oder unter Heute → Eintragen → 🏃 Bewegung. Oder einfach 🎤 „30 Minuten spazieren“ sagen.", "heute/home"],
      ["Wie trage ich Essen ein?", "Unten auf 🍽️ Essen – dort tippen, sprechen oder ein Foto machen.", "essen/analyze"],
      ["Wie ändere ich meine Figur?", "Im Überblick unter dem Park auf „✏️ Aussehen“ tippen.", "heute/home"],
      ["Wo ändere ich meine Tagesziele?", "Unten auf 👤 Profil → Meine Ziele.", "ziele"],
      ["Wie füge ich Freunde hinzu?", "Liga → 👥 Freunde: deinen Code teilen oder den Code deines Freundes eingeben.", "liga/friends"],
      ["Wofür bekomme ich Punkte?", "Liga → 💡 Erklärung zeigt alles, wofür es Punkte gibt.", "liga/rules"],
      ["Wo finde ich Rezepte?", "Essen → 📖 Rezepte: Kochbuch, selbst Gekochtes und Ideen aus dem Kühlschrank-Foto.", "essen/recipes"],
      ["Wie setze ich mir ein Abnehm-Ziel?", "Unten auf ⚖️ Mein Ziel – dort Ziel wählen und Zahlen eingeben.", "diet/today"],
      ["Wo sind die Spiele?", "Heute → 🎮 Spielen: Challenge, Boss, Glücksrad, Wissen, Events und mehr.", "heute/play"],
      ["Kann ich das Intro nochmal sehen?", "Profil → Einstellungen → Intro nochmal.", "ziele"]],
    en: [
      ["Where do I log exercise?", "Fastest: tap the 🏃 move ring in Overview. Or Today → Log → 🏃 Movement. Or just say 🎤 “walked 30 minutes”.", "heute/home"],
      ["How do I log food?", "Tap 🍽️ Food at the bottom – type, speak or take a photo.", "essen/analyze"],
      ["How do I change my figure?", "In Overview below the park, tap “✏️ Look”.", "heute/home"],
      ["Where do I change daily goals?", "Tap 👤 Profile → My goals.", "ziele"],
      ["How do I add friends?", "League → 👥 Friends: share your code or enter your friend's code.", "liga/friends"],
      ["What earns points?", "League → 💡 How it works lists everything that earns points.", "liga/rules"],
      ["Where are recipes?", "Food → 📖 Recipes: cookbook, homemade dishes and fridge-photo ideas.", "essen/recipes"],
      ["How do I set a weight goal?", "Tap ⚖️ My goal at the bottom – pick a goal and enter your numbers.", "diet/today"],
      ["Where are the games?", "Today → 🎮 Play: challenge, boss, wheel, lessons, events and more.", "heute/play"],
      ["Can I see the intro again?", "Profile → Settings → Replay intro.", "ziele"]] };
  let hbLog = [];
  function hbFaq(){ return HB_FAQ[lang] || HB_FAQ.en; }
  function goTarget(tg){
    if (!tg) return; const [m, sb] = String(tg).split("/");
    if (m === "diet"){ if (sb && ["today","prog","fun","set"].includes(sb)){ dietGrp = sb; dietSec = sb === "today" ? "today" : sb === "set" ? "set" : ""; } try { renderDiet(); } catch(e){} }
    if (m === "liga" && sb){ ligaSub = sb; try { renderLigaTabs(); } catch(e){} }
    let i = PAGES.findIndex(([a, b]) => a === m && (b === null || !sb || b === sb || m === "diet" || m === "liga"));
    if (i >= 0) goPage(i, 0);
  }
  function hbRender(){
    const log = $("#hbLog"); if (!log) return;
    log.innerHTML = hbLog.map((m, i) => `<div class="hbm ${m.who}">${esc(m.text)}${m.go ? `<button type="button" class="btn ghost" data-hbgo="${i}">${t("hb.show")}</button>` : ""}</div>`).join("");
    log.querySelectorAll("[data-hbgo]").forEach(b => b.onclick = () => { const g = hbLog[+b.dataset.hbgo].go; $("#helpSheet").classList.remove("open"); goTarget(g); });
    log.scrollTop = log.scrollHeight;
    $("#hbQuick").innerHTML = hbLog.length > 2 ? "" : hbFaq().slice(0, 6).map((f, i) => `<button type="button" class="chip" data-hbq="${i}">${esc(f[0])}</button>`).join("");
    $("#hbQuick").querySelectorAll("[data-hbq]").forEach(b => b.onclick = () => { const f = hbFaq()[+b.dataset.hbq]; hbLog.push({ who:"me", text:f[0] }, { who:"bot", text:f[1], go:f[2] }); hbRender(); });
  }
  function hbLocal(q){
    const words = q.toLowerCase().split(/[^a-zäöüßéèàçąćęłńóśźż0-9]+/).filter(w => w.length > 3);
    let best = null, bs = 0; hbFaq().forEach(f => { const h = (f[0] + " " + f[1]).toLowerCase(), sc = words.filter(w => h.includes(w.slice(0, Math.max(4, w.length - 2)))).length; if (sc > bs){ bs = sc; best = f; } });
    return best ? { text: best[1], go: best[2] } : { text: t("hb.noAi"), go: "" };
  }
  async function hbAsk(q){
    q = String(q || "").trim(); if (!q) return;
    hbLog.push({ who:"me", text:q }, { who:"bot", text:"…" }); hbRender(); $("#hbIn").value = "";
    let ans;
    if (AI){
      try {
        const hist = hbLog.slice(-7, -2).map(m => (m.who === "me" ? "Nutzer: " : "Hilfe: ") + m.text).join("\n");
        const x = await askJSON(`Du bist die freundliche Hilfe-Eule in der App FitTag. Beantworte Fragen zur Bedienung der App kurz (höchstens 3 Sätze), konkret und mit dem genauen Weg (z. B. „Unten auf Essen → Reiter Rezepte“). Erfinde keine Funktionen. Wenn etwas nicht in der App ist, sag das freundlich. Bei Gesundheitsfragen nur allgemein antworten und bei Bedarf auf Ärztin/Arzt verweisen.
${HELP_MAP}
Bisheriges Gespräch:
${hist}
Neue Frage: ${q}
Gib zusätzlich "ziel" an: die passende Stelle als einer dieser Werte oder "": heute/home, heute/play, heute/log, heute/office, heute/review, essen/analyze, essen/ideas, essen/recipes, essen/plan, essen/shop, essen/learn, diet/today, diet/prog, diet/fun, diet/set, liga/league, liga/friends, liga/rules, ziele.
${langLine()}
Antworte NUR mit JSON: {"antwort":"...","ziel":"..."}`);
        ans = { text: String(x.antwort || x.answer || "").trim() || t("hb.noAi"), go: String(x.ziel || "").trim() };
      } catch(e){ ans = hbLocal(q); }
    } else ans = hbLocal(q);
    hbLog[hbLog.length - 1] = { who:"bot", text: ans.text, go: ans.go };
    hbRender();
  }
  try {
    $("#helpFab").onclick = () => { if (!hbLog.length) hbLog.push({ who:"bot", text: t("hb.hello") }); $("#helpSheet").classList.add("open"); hbRender(); };
    $("#hbX").onclick = () => $("#helpSheet").classList.remove("open");
    $("#helpSheet").addEventListener("click", e => { if (e.target === $("#helpSheet")) $("#helpSheet").classList.remove("open"); });
    $("#hbSend").onclick = () => hbAsk($("#hbIn").value);
    $("#hbIn").addEventListener("keydown", e => { if (e.key === "Enter") hbAsk($("#hbIn").value); });
  } catch(e){}
  // ---------- Woche als eigene Seite ----------
  function openWeek(){ $("#v-woche").classList.add("open"); document.body.classList.add("noscroll"); $("#v-woche").scrollTop = 0; }
  function closeWeek(){ $("#v-woche").classList.remove("open"); document.body.classList.remove("noscroll"); }
  $("#weekOpen").onclick = openWeek;
  $("#weekClose").onclick = closeWeek;
  (function(){ let sx = null; const pn = $("#v-woche");
    pn.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive:true });
    pn.addEventListener("touchend", e => { if (sx !== null && e.changedTouches[0].clientX - sx > 90) closeWeek(); sx = null; }, { passive:true }); })();

  // ---------- Challenge-Details ----------
  const CH_PROG = {
    water: (d,g) => [+d.wasser||0, g.wasser], veg5: d => [+d.gemuese||0, 5], steps: (d,g) => [steps(d), g.schritte], move: (d,g) => [moveMin(d), g.bewegung],
    breaks3: d => [(d.breaks||[]).length, 3], eyes2: d => [(d.breaks||[]).filter(b=>b.id==="eyes").length, 2], breath: d => [(d.breaks||[]).some(b=>b.id==="breath")?1:0, 1],
    stand30: d => [+d.standMin||0, 30], green2: d => [(d.meals||[]).filter(m=>(m.hints||[]).includes("veg")).length, 2],
    recipe: d => [(d.meals||[]).some(m=>String(m.text||"").startsWith("📖"))?1:0, 1], nojunk: d => [(d.meals||[]).length, 2], noalc: d => [dayGame(d).hits, 2]
  };
  function openChallenge(){
    const [id, check] = challengeFor(keyFor(offset)), d = peek(offset), g = state.goals;
    const done = check ? !!check(d, g) : !!d.chManual;
    const pr = CH_PROG[id] ? CH_PROG[id](d, g) : null;
    $("#chDetail").innerHTML = `
      <h2>${esc(t("ch.title"))}</h2>
      <p class="chtext" style="margin-top:0">${esc(t("ch."+id))}</p>
      <p class="rctext">${esc(t("ch."+id+".d"))}</p>
      ${pr ? `<div class="glabel"><span>${t("ch.progress")}</span><span>${fmt(Math.min(pr[0],pr[1]))} / ${fmt(pr[1])}</span></div><div class="bar2"><div style="width:${Math.min(100, pr[0]/pr[1]*100)}%;background:${done?"var(--green)":"#d4a72c"}"></div></div>` : ""}
      ${done ? `<p class="chok" style="margin:12px 0 0">${t("ch.done")}</p>` : ""}
      <p class="note">${check ? t("ch.howAuto") : t("ch.howManual")}</p>
      <p class="note">${t("ch.reward")}</p>
      <p class="note">${t("ch.daily")}</p>
      ${!check && !done ? `<button class="btn wide" id="chDetDone">${t("ch.manual")}</button>` : ""}
      <button class="btn wide" id="chDetClose" style="background:transparent;color:var(--muted)">${t("rc.close")}</button>`;
    $("#chSheet").classList.add("open");
    $("#chDetClose").onclick = () => $("#chSheet").classList.remove("open");
    const b = $("#chDetDone"); if (b) b.onclick = () => { dayOf(offset).chManual = true; save(); render(); toast(t("ch.done")); $("#chSheet").classList.remove("open"); };
  }
  $("#chCard").addEventListener("click", e => { if (e.target.closest("button")) return; openChallenge(); });
  $("#chSheet").addEventListener("click", e => { if (e.target === $("#chSheet")) $("#chSheet").classList.remove("open"); });

  // ---------- Einführung ----------
  let tourI = 0; var tourSet = "tourS";
  function tourPage(pg){
    try {
      const [m, sb] = pg.split("/");
      const i = PAGES.findIndex(p => p[0] === m && (sb ? p[1] === sb : true));
      if (i >= 0) goPage(i, 0);
      document.querySelectorAll("nav button").forEach(b => b.classList.toggle("tourhl", b.dataset.v === m));
      window.scrollTo({ top: 0 });
    } catch(e){}
  }
  function showTour(i){
    const slides = tourSlides(); tourI = i;
    const [title, text, pg] = slides[i], m = title.match(/^(\S+)\s(.*)$/);
    $("#tourEmoji").textContent = m ? m[1] : "👋";
    $("#tourTitle").textContent = m ? m[2] : title;
    $("#tourText").textContent = text;
    $("#tourExtra").innerHTML = i === 0 ? `<input type="text" id="tourName" maxlength="30" placeholder="${esc(t("tour.name"))}" value="${esc(myName() || "")}">
      <div class="chips tourlang">${[["de","🇩🇪 DE"],["en","🇬🇧 EN"],["fr","🇫🇷 FR"],["pl","🇵🇱 PL"]].map(([k,l]) => `<button type="button" class="chip ${lang === k ? "on" : ""}" data-tl="${k}">${l}</button>`).join("")}</div>` : "";
    $("#tourExtra").querySelectorAll("[data-tv]").forEach(b => b.onclick = () => { const nm = $("#tourName") ? $("#tourName").value : ""; tourSet = b.dataset.tv; showTour(0); if ($("#tourName")) $("#tourName").value = nm; });
    $("#tourExtra").querySelectorAll("[data-tl]").forEach(b => b.onclick = () => { const nm = $("#tourName") ? $("#tourName").value : ""; setLang(b.dataset.tl); showTour(0); if ($("#tourName")) $("#tourName").value = nm; });
    $("#tourDots").innerHTML = slides.map((_,k)=>`<span class="${k===i?"on":""}"></span>`).join("");
    $("#tourNext").textContent = i === slides.length - 1 ? t("tour.go") : t("tour.next");
    const fork = tourSet === "tourS" && i === slides.length - 1;
    $("#tourNext").style.display = fork ? "none" : "";
    if (fork){
      $("#tourExtra").innerHTML = `<div class="tourfork"><button type="button" class="btn wide" data-tf="go">${esc(t("tour.fGo"))}</button><button type="button" class="btn ghost wide" data-tf="all">${esc(t("tour.fAll"))}</button></div>`;
      $("#tourExtra").querySelector('[data-tf="go"]').onclick = endTour;
      $("#tourExtra").querySelector('[data-tf="all"]').onclick = () => { tourSet = "tour3"; showTour(3); };
    }
    $("#tourBack").style.visibility = i === 0 ? "hidden" : "visible";
    $("#tourSheet").classList.add("open");
    tourPage(pg);
  }
  function endTour(){ if (tourSet === "tour3"){ const m = Object.assign({}, state.tipsSeen || {}); Object.keys(t("ptips") || {}).forEach(k => m[k] = 1); state.tipsSeen = m; } $("#tourSheet").classList.remove("open"); document.querySelectorAll("nav button").forEach(b => b.classList.remove("tourhl")); state.tourDone = true; metaTouched = true; save(); try { localStorage.setItem("fittag-tour","1"); } catch(e){} goPage(0); }
  $("#tourNext").onclick = () => {
    if (tourI === 0 && $("#tourName")){ const nm = $("#tourName").value.trim(); if (nm && nm !== myName()) setName(nm); }
    if (tourI < tourSlides().length - 1) showTour(tourI + 1); else endTour();
  };
  $("#tourBack").onclick = () => { if (tourI > 0) showTour(tourI - 1); };
  $("#tourSkip").onclick = endTour;

  setTimeout(() => { let seen = false; try { seen = !!localStorage.getItem("fittag-tour"); } catch(e){} if (!state.tourDone && !seen){ tourSet = "tourS"; showTour(0); } }, 1200);

  // ---------- Android-App: Schritte aus Health Connect ----------
  const NATIVE = window.FitTagNative;
  if (NATIVE){
    setStorage("st.phone");
    $("#syncSteps").style.display = "block";
    $("#stepsNote").textContent = t("steps.native");
    $("#syncSteps").onclick = () => { $("#stepsNote").textContent = t("steps.fetching"); try { NATIVE.syncSteps(true); } catch(e){} };
    window.onNativeSteps = (data) => {
      const obj = typeof data === "string" ? JSON.parse(data) : data;
      let changed = false;
      Object.keys(obj || {}).forEach(k => {
        const n = Math.round(+obj[k] || 0);
        if (n <= 0) return;
        if (!state.days[k]) state.days[k] = { wasser:0, gemuese:0, acts:[], meals:[] };
        if (state.days[k].schritte !== n){ state.days[k].schritte = n; changed = true; }
      });
      const tm = new Date().toLocaleTimeString(LOCALE[lang],{hour:"2-digit",minute:"2-digit"});
      $("#stepsNote").textContent = t("steps.synced",{t:tm});
      if (changed){ save(); render(); }
    };
    window.onNativeStepsError = (msg) => { $("#stepsNote").textContent = msg; };
    try { NATIVE.syncSteps(false); } catch(e){}
  }

  function setLang(l){
    if (!I18N[l]) return;
    lang = l; state.lang = l; metaTouched = true;
    try { localStorage.setItem("fittag-lang", l); } catch(e){}
    applyStatic();
    setStorage(storageKey);
    if (aiOffKey) $("#aiOffTxt").textContent = t(aiOffKey);
    if (!window.FitTagNative) $("#stepsNote").textContent = t("steps.note");
    ["#foodOut","#suggOut","#menuOut"].forEach(x => $(x).innerHTML = "");
    drawSuggType();
    save(); render(); drawAvatarEditor();
  }

  function drawLangMenu(){
    const cur = LANGS.find(x => x[0] === lang);
    $("#langCur").textContent = cur[2] + " " + cur[0].toUpperCase();
    $("#langMenu").innerHTML = LANGS.map(([c,n,f]) => `<button role="menuitem" data-lang="${c}" class="${c===lang?"on":""}">${f} ${n}</button>`).join("");
    $("#langMenu").querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { closeLang(); setLang(b.dataset.lang); drawLangMenu(); });
  }
  const closeLang = () => { $("#langMenu").classList.remove("open"); $("#langBtn").setAttribute("aria-expanded","false"); };
  $("#langBtn").onclick = e => {
    e.stopPropagation();
    const open = !$("#langMenu").classList.contains("open");
    $("#langMenu").classList.toggle("open", open);
    $("#langBtn").setAttribute("aria-expanded", String(open));
  };
  document.addEventListener("click", e => { if (!e.target.closest(".langwrap")) closeLang(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLang(); });
  drawLangMenu();
  $("#avBtn").onclick = () => { const b = $("#avEditor"); b.classList.toggle("open"); if (b.classList.contains("open")) drawAvatarEditor(); else b.innerHTML = ""; };

  applyStatic();
  if (!window.FitTagNative) $("#stepsNote").textContent = t("steps.note");
  setStorage(storageKey);
  render();
  connect();
})();
</script>
